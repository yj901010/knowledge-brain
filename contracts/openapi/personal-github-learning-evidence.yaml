components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-brain_guest
  schemas:
    Evidence:
      type: object
      additionalProperties: false
      required:
      - evidenceId
      - roadmapId
      - spaceId
      - nodeId
      - repositoryId
      - commitId
      - nodeTitle
      - visibility
      - state
      - version
      - commitVersion
      - repositoryFullName
      - sha
      - subject
      - authorLogin
      - committedAt
      - importedAt
      - url
      - memo
      - createdAt
      - updatedAt
      properties:
        evidenceId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        roadmapId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        spaceId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        nodeId: &id006
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        repositoryId: &id007
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        commitId: &id008
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        nodeTitle:
          type: string
          minLength: 1
          maxLength: 200
        visibility:
          const: PRIVATE
        state:
          enum:
          - ACTIVE
          - RETIRED
        version: &id010
          type: integer
          minimum: 1
          maximum: 9007199254740991
        commitVersion:
          const: 1
        repositoryFullName: &id012
          type: string
          pattern: ^[A-Za-z0-9-]{1,39}/[A-Za-z0-9_.-]{1,100}$
        sha: &id013
          type: string
          pattern: ^([0-9a-f]{40}|[0-9a-f]{64})$
        subject:
          type: string
          maxLength: 500
        authorLogin:
          type:
          - string
          - 'null'
        committedAt: &id005
          type: string
          format: date-time
        importedAt: *id005
        url:
          type: string
          format: uri
        memo: &id009
          type: string
          description: At most8192 UTF-8 bytes; no controls except tab/CR/LF.
        createdAt: *id005
        updatedAt: *id005
    Create:
      type: object
      additionalProperties: false
      required:
      - nodeId
      - repositoryId
      - commitId
      - memo
      properties:
        nodeId: *id006
        repositoryId: *id007
        commitId: *id008
        memo: *id009
    Memo:
      type: object
      additionalProperties: false
      required:
      - memo
      properties:
        memo: *id009
    Revision:
      type: object
      additionalProperties: false
      required:
      - revisionId
      - evidenceId
      - version
      - actorId
      - occurredAt
      - snapshot
      properties:
        revisionId: *id001
        evidenceId: *id001
        version: *id010
        actorId: *id001
        occurredAt: *id005
        snapshot:
          $ref: '#/components/schemas/Evidence'
    Related:
      type: object
      additionalProperties: false
      required:
      - evidenceId
      - roadmapId
      - roadmapTitle
      - roadmapState
      - nodeId
      - nodeTitle
      - evidenceState
      - evidenceVersion
      - repositoryId
      - commitId
      - repositoryFullName
      - sha
      properties:
        evidenceId: *id001
        roadmapId: *id001
        roadmapTitle: &id011
          type: string
        roadmapState:
          enum:
          - ACTIVE
          - RETIRED
        nodeId: *id001
        nodeTitle: *id011
        evidenceState:
          enum:
          - ACTIVE
          - RETIRED
        evidenceVersion: *id010
        repositoryId: *id001
        commitId: *id001
        repositoryFullName: *id012
        sha: *id013
    Page:
      type: object
      additionalProperties: false
      required:
      - items
      - nextAfter
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Evidence'
        nextAfter:
          anyOf:
          - *id001
          - type: 'null'
    RelatedPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextAfter
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Related'
        nextAfter:
          anyOf:
          - *id001
          - type: 'null'
