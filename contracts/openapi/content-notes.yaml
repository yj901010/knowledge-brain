openapi: 3.1.0
info:
  title: Private Markdown Note API
  version: 1.0.0
  description: Content-owned Personal Space notes. Space authorization verified on
    every call; guest cookie only. Deletes retire notes and retain history. Raw Markdown
    is not rendered. Wiki Links and backlinks are Content-owned and Space-authorized;
    GET metadata is private.
servers:
- url: https://localhost:8443
security:
- guestCookie: []
paths:
  /api/spaces/{spaceId}/notes:
    parameters:
    - name: spaceId
      in: path
      required: true
      schema: &id001
        type: string
        format: uuid
        description: Canonical UUIDv7
    post:
      operationId: createNote
      parameters:
      - &id002
        name: Origin
        in: header
        required: true
        schema:
          type: string
          description: Must equal configured browser origin
      requestBody: &id003
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Edit'
      responses:
        '201':
          description: Success
          headers:
            ETag:
              description: Strong version ETag, for example "1"
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
            Location:
              schema:
                type: string
              description: Created Note path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          description: Invalid identifier, JSON, page or Markdown bounds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, expired or revoked guest cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin, method or role denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown, inaccessible or retired active Note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Version differs; reload before saving
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: JSON body exceeds 256 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: JSON required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '428':
          description: If-Match missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Gateway cannot reach Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Content persistence or Space/Identity authority unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Gateway complete-response timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listNotes
      description: Same-Space private Notes in ascending immutable Note ID order. ACTIVE
        is the default. RETIRED discovers retained titles and versions for history reads;
        item GET and writes still require an active Note. Unknown or duplicate query
        parameters are rejected. Reading does not restore Notes or emit domain events.
      parameters:
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum: [ACTIVE, RETIRED]
          default: ACTIVE
      - name: after
        in: query
        required: false
        schema: *id001
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Strong version ETag, for example "1"
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          description: Invalid identifier, JSON, page or Markdown bounds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, expired or revoked guest cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin, method or role denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown, inaccessible or retired active Note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Version differs; reload before saving
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: JSON body exceeds 256 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: JSON required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '428':
          description: If-Match missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Gateway cannot reach Content
          content:
