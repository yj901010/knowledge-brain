  /api/spaces/{spaceId}/notes/{noteId}/links:
    parameters:
    - name: spaceId
      in: path
      required: true
      schema: &id005
        type: string
        format: uuid
        description: Canonical UUIDv7
    - name: noteId
      in: path
      required: true
      schema: *id005
    get:
      operationId: getNoteLinks
      description: Outgoing links in Markdown occurrence order; exclusive ordinal
        after. noteVersion and linkVersion are independent.
      parameters:
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Outgoing links in Markdown occurrence order; exclusive ordinal
            after. noteVersion and linkVersion are independent.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiLinkPage'
        '400':
          description: Invalid cursor, page limit or identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
