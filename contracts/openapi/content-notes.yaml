      description: Active source summaries in UUID order; exclusive UUID after. Repeated
        edges counted per source.
      parameters:
      - name: after
        in: query
        schema: *id005
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
