  /api/spaces/{spaceId}/notes/{noteId}/revisions:
    parameters:
    - name: spaceId
      in: path
      required: true
      schema: *id001
    - name: noteId
      in: path
      required: true
      schema: *id001
    get:
      operationId: listNoteRevisions
      description: Retired notes remain visible to authorized members through history.
        Descending version; use last version as before cursor.
      parameters:
      - name: before
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          default: 9223372036854775807
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Strong version ETag, for example "1"
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Revision'
