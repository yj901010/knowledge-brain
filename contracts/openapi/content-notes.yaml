  /api/spaces/{spaceId}/notes/{noteId}/metadata:
    parameters: &id008
    - &id009
      name: spaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: noteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Read note tags and typed properties
      security: &id006
      - guestCookie: []
      responses:
        '200': &id007
          description: Private metadata snapshot; metadata ETag is independent of
            Markdown version
          headers:
            ETag:
              schema:
                type: string
              example: '"m1"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteMetadata'
        '401':
          description: Unauthenticated
        '404':
          description: Unavailable or unauthorized
    put:
      summary: Replace the complete tag and property set atomically
      security: *id006
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: ^"m(0|[1-9][0-9]*)"$
        example: '"m0"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataEdit'
      responses:
        '200': *id007
        '400':
          description: Invalid typed value or bounds
        '401':
          description: Unauthenticated
        '403':
          description: Invalid browser Origin
        '404':
          description: Unavailable or unauthorized
        '409':
          description: Space property type conflict
        '412':
          description: Stale metadata ETag
        '413':
          description: JSON exceeds 16 KiB
        '428':
          description: If-Match required
        '503':
          description: Authorization dependency unavailable
  /api/spaces/{spaceId}/notes/{noteId}/metadata/revisions:
    parameters: *id008
    get:
      summary: Read private immutable metadata snapshots, including retired notes
      security: *id006
      parameters:
      - name: before
        in: query
        schema:
          type: integer
          minimum: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
      responses:
        '200':
          description: Newest first; exclusive before metadata version
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetadataRevision'
        '404':
          description: Unavailable or unauthorized
  /api/spaces/{spaceId}/tags:
    get:
      summary: List Space tags with active-note usage counts
      security: *id006
      parameters:
      - *id009
      - name: q
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: Optional literal name substring, normalized to NFC before matching.
          The normalized query must contain 1..64 Unicode code points; raw input is
          bounded to 128 code points. Case and spaces are significant; no trimming,
          wildcard or regular-expression expansion. Reject controls and invalid Unicode.
          Applied before UUIDv7 keyset pagination; repeat the same query on every page.
      - name: after
        in: query
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: UUID keyset page; unused definitions retained
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataDefinitionPage'
        '400':
          description: Invalid, empty, oversized or duplicate query or page parameter
        '404':
          description: Unavailable or unauthorized
  /api/spaces/{spaceId}/property-definitions:
    get:
      summary: List Space property-definitions with active-note usage counts
      security: *id006
      parameters:
      - *id009
      - name: q
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: Optional literal name substring, normalized to NFC before matching.
          The normalized query must contain 1..64 Unicode code points; raw input is
          bounded to 128 code points. Case and spaces are significant; no trimming,
          wildcard or regular-expression expansion. Reject controls and invalid Unicode.
          Applied before UUIDv7 keyset pagination; repeat the same query on every page.
      - name: after
        in: query
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: UUID keyset page; unused definitions retained
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataDefinitionPage'
        '400':
          description: Invalid, empty, oversized or duplicate query or page parameter
        '404':
          description: Unavailable or unauthorized
  /api/spaces/{spaceId}/daily-notes:
    parameters:
    - &id011
      name: spaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      summary: Open or create the unique Daily Note for a Space calendar date
      description: No overwrite on repeated opens. Immutable initial timezone. A retired
        date cannot be recreated. Body <=1 KiB. Same-origin HTTPS required; uses existing
        NOTE_WRITE authority. Location references the canonical Note; ETag is its
        Markdown version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - date
              - timezone
              properties:
                date: &id010
                  type: string
                  format: date
                  pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
                timezone: &id012
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Explicit TZDB/IANA ZoneId, for example Asia/Seoul or
                    UTC. Fixed-offset strings are rejected.
            example:
              date: '2026-10-07'
              timezone: Asia/Seoul
      responses:
        '201':
          description: Created atomically with Note and events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyNoteEntry'
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
            ETag:
              schema:
                type: string
              example: '"1"'
            Location:
              schema:
                type: string
              description: Canonical Note resource path
        '200':
          description: Existing Note returned unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyNoteEntry'
          headers:
            Cache-Control:
              schema:
                type: string
