        '502':
          description: Gateway cannot reach Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Content persistence or Space/Identity authority unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Gateway complete-response timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: List active private Notes assigned to a Space tag
  /api/spaces/{spaceId}/property-definitions/{propertyId}/notes:
    parameters:
    - name: spaceId
      in: path
      required: true
      schema: &propertyNotesId001
        type: string
        format: uuid
        description: Canonical UUIDv7
    - name: propertyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        description: UUIDv7 of a property defined in this Space
    get:
      description: Fresh Space permission on every page. Known unused definitions return
        an empty page; unknown/foreign properties return 404. Only after, limit, value,
        minValue, maxValue and tagId query
        keys are allowed. Live UUIDv7 keyset pages, not a snapshot; values use the fixed
        Space property type. NUMBER values must be read with decimal precision. Reads
        create no revisions or events.
      parameters:
      - name: value
        in: query
        required: false
        allowEmptyValue: true
        schema:
          type: string
          maxLength: 200
        description: Optional exact typed value. Absent means all assigned Notes; empty
          string matches empty STRING or an empty STRING_LIST element. STRING/DATE/BOOLEAN/NUMBER
          compare exact values (numbers use decimal equivalence); STRING_LIST matches a
          complete element. Strings are case/whitespace sensitive, no wildcard. Encode with
          URLSearchParams. BOOLEAN true/false, DATE valid YYYY-MM-DD, NUMBER exact JSON
          numeric syntax (96 characters, at most three exponent digits; normalized precision
          at most 38, scale at most 18 and at most 56 integer digits). NUL is rejected.
          Mutually exclusive with minValue/maxValue. Conditions remain on every keyset
          page; no full-text matching.
      - name: minValue
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 200
        description: Inclusive lower bound for NUMBER or DATE only, using the same typed
          syntax and precision limits as value. May be used alone or with maxValue.
          Cannot be combined with value. If both bounds are present, minValue must not
          exceed maxValue. Omit a bound to leave that direction unbounded. Apply bounds
          before keyset pagination and send them again on every page.
      - name: tagId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Canonical lowercase UUIDv7 of one tag defined in this Space. AND
          with the selected property and optional value or minValue/maxValue conditions,
          before keyset pagination. Omit for any tag membership. Known unused tags return
          an empty page; unknown or foreign tags return 404. Send again on every page.
      - name: maxValue
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 200
        description: Inclusive upper bound for NUMBER or DATE only, using the same typed
          syntax and precision limits as value. May be used alone or with minValue.
          Cannot be combined with value. Invalid, empty, inverted or unsupported typed
          bounds return 400. Every valid page requires fresh Space authorization and
          a property defined in the same Space.
      - name: after
        in: query
        required: false
        schema: *propertyNotesId001
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Strong version ETag, for example "1"
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyNotesPage'
        '400':
          description: Invalid identifier, JSON, page or Markdown bounds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, expired or revoked guest cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin, method or role denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Space or property unavailable
        '412':
          description: Version differs; reload before saving
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: JSON body exceeds 256 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: JSON required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '428':
          description: If-Match missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Gateway cannot reach Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Content persistence or Space/Identity authority unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Gateway complete-response timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: List active private Notes and their current value for a Space property
components:
  securitySchemes:
    guestCookie:
      type: apiKey
      in: cookie
      name: __Host-brain_guest
  schemas:
    PropertyNote:
      type: object
      additionalProperties: false
      required:
      - noteId
      - title
      - version
      - metadataVersion
      - updatedAt
      - value
      properties:
        noteId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        version:
          type: integer
          minimum: 1
        metadataVersion:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
          description: Note body update time; property changes have their own metadataVersion
        value:
          oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: array
            maxItems: 20
            items:
              type: string
              maxLength: 200
          description: Current canonical typed value; NUMBER is an exact JSON decimal,
            not binary floating point. Type is given by the parent page.
    PropertyNotesPage:
      type: object
      additionalProperties: false
      required:
      - propertyId
      - name
      - type
      - items
      - nextAfter
      properties:
        tagId:
          type: [string, 'null']
          format: uuid
          description: Applied tag condition, or null when no tag filter is active.
        propertyId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 64
        type:
          type: string
          enum:
          - STRING
          - NUMBER
          - BOOLEAN
          - DATE
          - STRING_LIST
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PropertyNote'
        nextAfter:
          type:
          - string
          - 'null'
          format: uuid
    Edit:
      type: object
      additionalProperties: false
      required:
      - title
      - markdown
      properties:
        title: &id014
          type: string
          minLength: 1
          maxLength: 200
          description: Nonblank, no NUL; <=200 Unicode code points
        markdown: &id015
          type: string
          description: Raw Markdown, no NUL, <=32768 UTF-8 bytes; never rendered by
            this API
    Note:
      type: object
      required:
      - noteId
      - spaceId
      - visibility
      - state
      - version
      - title
      - markdown
      - createdAt
      - updatedAt
      properties:
        noteId: *id001
        spaceId: *id001
        visibility:
          type: string
          const: PRIVATE
        state:
          type: string
          enum:
          - ACTIVE
          - RETIRED
        version:
          type: integer
          format: int64
          minimum: 1
        title: *id014
        markdown: *id015
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Revision:
      type: object
      required:
      - revisionId
      - noteId
      - version
      - state
      - title
      - markdown
      - actorId
      - occurredAt
      properties:
        revisionId: *id001
        noteId: *id001
        version:
          type: integer
          format: int64
        state:
          type: string
          enum:
          - ACTIVE
          - RETIRED
        title:
          type: string
        markdown:
          type: string
        actorId: *id001
        occurredAt:
          type: string
          format: date-time
    Summary:
      type: object
      required:
      - noteId
      - title
      - version
      - updatedAt
      properties:
        noteId: *id001
        title:
          type: string
        version:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    Page:
      type: object
      required:
      - items
      - nextAfter
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Summary'
        nextAfter:
          type:
          - string
          - 'null'
          format: uuid
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    WikiLink:
      type: object
      required:
      - linkId
      - ordinal
      - startOffset
      - endOffset
      - targetToken
      - label
      - fragment
      - targetNoteId
      - targetTitle
      - status
      properties:
        linkId:
          type: string
          format: uuid
          description: Canonical UUIDv7
        ordinal:
          type: integer
          minimum: 0
        startOffset:
          type: integer
          minimum: 0
          description: Inclusive UTF-16 code-unit offset in Markdown
        endOffset:
          type: integer
          description: Exclusive UTF-16 code-unit offset
        targetToken:
          type: string
        label:
          type:
          - string
          - 'null'
        fragment:
          type:
          - string
          - 'null'
        targetNoteId:
          type:
          - string
          - 'null'
          format: uuid
          description: Canonical UUIDv7
        targetTitle:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - UNRESOLVED
          - AMBIGUOUS
          - RESOLVED
          - TARGET_RETIRED
    WikiLinkPage:
      type: object
      required:
      - noteVersion
      - linkVersion
      - items
      - nextAfter
      properties:
        noteVersion:
          type: integer
          format: int64
          minimum: 1
        linkVersion:
          type: integer
          format: int64
          minimum: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/WikiLink'
        nextAfter:
          type:
          - integer
          - 'null'
          minimum: 0
    Backlink:
      type: object
      required:
      - sourceNoteId
      - title
      - version
      - linkCount
      properties:
        sourceNoteId:
          type: string
          format: uuid
          description: Canonical UUIDv7
        title:
          type: string
        version:
          type: integer
          format: int64
        linkCount:
          type: integer
          format: int64
          minimum: 1
    BacklinkPage:
      type: object
      required:
      - items
      - nextAfter
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Backlink'
        nextAfter:
          type:
          - string
          - 'null'
          format: uuid
          description: Canonical UUIDv7
    MetadataEdit:
      type: object
      additionalProperties: false
      required:
      - tags
      - properties
      properties:
        tags:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        properties:
          type: object
          maxProperties: 32
          additionalProperties:
            $ref: '#/components/schemas/TypedPropertyInput'
    TypedPropertyInput:
      type: object
      additionalProperties: false
      required:
      - type
      - value
      properties:
        type: &id016
          type: string
          enum:
          - STRING
          - NUMBER
          - BOOLEAN
          - DATE
          - STRING_LIST
        value: &id017
          oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: array
            items:
              type: string
      oneOf: &id018
      - properties:
          type:
            const: STRING
          value:
            type: string
            maxLength: 1000
      - properties:
          type:
            const: NUMBER
          value:
            type: number
      - properties:
          type:
            const: BOOLEAN
          value:
            type: boolean
      - properties:
          type:
            const: DATE
          value:
            type: string
            format: date
            pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      - properties:
          type:
            const: STRING_LIST
          value:
            type: array
            maxItems: 20
            items:
              type: string
              maxLength: 200
    NoteMetadata:
      type: object
      required:
      - noteId
      - metadataVersion
      - tags
      - properties
      properties:
        noteId:
          type: string
          format: uuid
        metadataVersion:
          type: integer
          minimum: 0
        tags:
          type: array
          items:
            type: object
            properties:
              tagId:
                type: string
                format: uuid
              name:
                type: string
        properties:
          type: array
          items:
            type: object
            properties:
              propertyId:
                type: string
                format: uuid
              name:
                type: string
              type: *id016
              value: *id017
            oneOf: *id018
    MetadataRevision:
      type: object
      properties:
        revisionId:
          type: string
          format: uuid
        metadataVersion:
          type: integer
        actorId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        snapshot:
          $ref: '#/components/schemas/NoteMetadata'
    MetadataDefinitionPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              type:
                type: string
              activeNoteCount:
                type: integer
                minimum: 0
        nextAfter:
          type:
          - string
          - 'null'
          format: uuid
    DailyNoteEntry:
      type: object
      required:
      - date
      - timezone
      - note
      properties:
        date: *id010
        timezone: *id012
        note:
          $ref: '#/components/schemas/Note'
    DailyNoteToday:
      type: object
      required:
      - date
      - timezone
      - entry
      properties:
        date: *id010
        timezone: *id012
        entry:
          oneOf:
          - $ref: '#/components/schemas/DailyNoteEntry'
          - type: 'null'
    DailyNotePage:
      type: object
      required:
      - items
      - nextBefore
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - date
            - timezone
            - noteId
            - title
            - version
            - updatedAt
            properties:
              date: *id010
              timezone: *id012
              noteId:
                type: string
                format: uuid
              title:
                type: string
              version:
                type: integer
                minimum: 1
              updatedAt:
                type: string
                format: date-time
        nextBefore:
          type:
          - string
          - 'null'
          format: date
    AttachmentItem:
      type: object
      properties:
        attachmentId: *id013
        mediaId: *id013
        filename:
          type: string
          minLength: 1
          maxLength: 200
          description: NFC filename, no control characters or slash
        mimeType:
          type: string
          enum:
          - application/octet-stream
          - application/pdf
          - image/png
          - image/jpeg
          - image/gif
          - image/webp
        byteSize:
          type: integer
          minimum: 1
          maximum: 10485760
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    AttachmentSnapshot:
      type: object
      properties:
        noteId: *id013
        attachmentVersion:
          type: integer
          minimum: 0
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AttachmentItem'
    AttachmentEdit:
      type: object
      additionalProperties: false
      required:
      - mediaIds
      properties:
        mediaIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: *id013
    AttachmentRevision:
      type: object
      properties:
        revisionId: *id013
        attachmentVersion:
          type: integer
          minimum: 1
        actorId: *id013
        occurredAt:
          type: string
          format: date-time
        snapshot:
          $ref: '#/components/schemas/AttachmentSnapshot'
    AttachmentHistory:
      type: array
      maxItems: 10
      items:
        $ref: '#/components/schemas/AttachmentRevision'
