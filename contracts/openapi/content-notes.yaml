        type: string
        format: uuid
        description: Canonical UUIDv7
    - name: tagId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        description: UUIDv7 of a tag defined in this Space
    get:
      description: Fresh Space authorization on every page. Known unused tags return
        an empty page; unknown or foreign tags return 404. UUIDv7 ascending keyset;
        live reads, not a snapshot. Read-only canonical Content relationship; no search
        or graph projection dependency. Only after and limit query parameters are accepted.
      parameters:
