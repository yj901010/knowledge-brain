openapi: 3.1.0
info:
  title: Course own resubmission requests
  version: 1.0.0
  description: Fresh registered Group OWNER/MEMBER/VIEWER reads only existing requests
    on own submissions in current canonical Course curriculum, independent of enrollment/private
    progress. REQUESTED default; ALL, RESOLVED, CANCELLED, UNAVAILABLE retain exact
    answer-version semantics. New-answer resolution is not grading/completion. Fourteen
    content-free metadata fields; original source retains reasons/answers. Archived
    parents retain reads. Current Study labels preserve pinned Course history. Full
    local Group/Space/Course/Study/Assignment/actor scope in one statement, filtered
    Submission UUIDv7 keyset, default20/max100. Fresh curriculum/source navigation.
    No peer roster, writes, events, migration, dependency or notification/progress
    mutation. Existing endpoints unchanged.
servers:
- url: https://localhost:8443
security:
- browserSession: []
paths:
  /api/groups/{groupId}/courses/{courseId}/my-resubmission-requests:
    parameters:
    - name: groupId
      in: path
      required: true
      schema: &id001
        $ref: assignment-submissions.yaml#/components/schemas/Id
    - name: courseId
      in: path
      required: true
      schema: *id001
    get:
      operationId: getCourseOwnResubmissionRequests
      parameters:
      - name: filter
        in: query
        schema:
          type: string
          enum:
          - REQUESTED
          - RESOLVED
          - CANCELLED
          - ALL
          - UNAVAILABLE
          default: REQUESTED
      - name: after
        in: query
        schema: *id001
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '400':
          description: Malformed/singleton query, limit, cursor or nonempty GET body
        '401':
          description: Secure singleton browser session required
        '403':
          description: Registered Group participation required
        '404':
          description: Missing current Group participation or exact parent scope
        '503':
          description: Space authority unavailable
        '200':
          description: Own existing request metadata within current canonical Course
            curriculum
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-brain_guest
  schemas:
    Row:
      type: object
      additionalProperties: false
      required:
      - submissionId
      - assignmentId
      - assignmentTitle
      - assignmentState
      - version
      - assignmentVersion
      - updatedAt
      - requestVersion
      - requestState
      - requestedSubmissionVersion
      - resolvedSubmissionVersion
      - studyId
      - studyTitle
      - courseState
      properties:
        submissionId: &id002
          $ref: assignment-submissions.yaml#/components/schemas/Id
        assignmentId: *id002
        assignmentTitle:
          type: string
          minLength: 1
          maxLength: 200
        assignmentState:
          type: string
          enum:
          - DRAFT
          - OPEN
          - CLOSED
          - RETIRED
        version: &id003
          type: integer
          format: int64
          minimum: 1
        assignmentVersion: *id003
        updatedAt:
          type: string
          format: date-time
        requestVersion: *id003
        requestState:
          type: string
          enum:
          - REQUESTED
          - RESOLVED
          - CANCELLED
          - UNAVAILABLE
        requestedSubmissionVersion: *id003
        resolvedSubmissionVersion:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        studyId:
          $ref: assignment-submissions.yaml#/components/schemas/Id
        studyTitle:
          type: string
          minLength: 1
          maxLength: 200
        courseState:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - COMPLETED
          - RETIRED
    Page:
      type: object
      additionalProperties: false
      required:
      - items
      - nextAfter
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Row'
        nextAfter:
          anyOf:
          - *id001
          - type: 'null'
