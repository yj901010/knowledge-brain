openapi: 3.1.0
info:
  title: OWNER Course submission grading queue
  version: 1.0.0
  description: Fresh registered current Group OWNER only. Submitted work from current
    canonical Course curriculum, excluding OWNER own submissions under existing no-self-grading
    rule. Independent of enrollment/private progress. Sixteen metadata fields extend
    original ten-field grading row with current Assignment and Study labels/IDs/state
    and Course state; pinned source/Course history unchanged. NEEDS_GRADING default
    includes all except CURRENT. MISSING/CURRENT/OUTDATED/RETRACTED/UNAVAILABLE/ALL
    retain exact latest grade-version annotation semantics; zero/direct/rubric grades
    count, historical markers never mark newer grades, unknown fails closed. No non-submitter
    roster, score/reason/answer/file copies or automatic approval/completion. One
    local joined statement, full Group/Space/Course/Study/Assignment/author scope,
    filter before ascending Submission UUIDv7 keyset, default20/max100 and limit+1.
    Archived reads retain original source write rules. Selection freshly verifies
    current curriculum then exact original Submission source. No writes/events/migrations/dependencies,
    enrollment, notification or private progress sharing. Existing endpoints unchanged.
servers:
- url: https://localhost:8443
security:
- browserSession: []
paths:
  /api/groups/{groupId}/courses/{courseId}/submissions/grading-queue:
    parameters:
    - name: groupId
      in: path
      required: true
      schema: &id001
        $ref: assignment-submissions.yaml#/components/schemas/Id
    - name: courseId
      in: path
      required: true
      schema:
        $ref: assignment-submissions.yaml#/components/schemas/Id
    get:
      operationId: getOwnerCourseGradingQueue
      parameters:
      - name: filter
        in: query
        schema:
          type: string
          enum:
          - NEEDS_GRADING
          - ALL
          - MISSING
          - CURRENT
          - OUTDATED
          - RETRACTED
          - UNAVAILABLE
          default: NEEDS_GRADING
      - name: after
        in: query
        schema: *id001
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '400':
          description: Malformed/singleton query, limit, cursor or nonempty GET body
        '401':
          description: Secure singleton browser session required
        '403':
          description: Current registered Group OWNER required, even for empty results
        '404':
          description: Missing current Group participation or exact parent scope
        '503':
          description: Space authority unavailable
        '200':
          description: Other authors submitted grading metadata within current canonical
            Course curriculum
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-brain_guest
  schemas:
    Row:
      type: object
      additionalProperties: false
      required:
      - submissionId
      - authorId
      - version
      - assignmentVersion
      - updatedAt
      - gradingStatus
      - gradeVersion
      - gradedSubmissionVersion
      - gradeRetractionState
      - retractionVersion
      - assignmentId
      - assignmentTitle
      - assignmentState
      - studyId
      - studyTitle
      - courseState
      properties:
        submissionId: *id001
        authorId: *id001
        version: &id002
          type: integer
          format: int64
          minimum: 1
        assignmentVersion: *id002
        updatedAt:
          type: string
          format: date-time
        gradingStatus:
          type: string
          enum:
          - MISSING
          - CURRENT
          - OUTDATED
          - RETRACTED
          - UNAVAILABLE
        gradeVersion: &id003
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        gradedSubmissionVersion: *id003
        gradeRetractionState:
          type: string
          enum:
          - NONE
          - RETRACTED
          - RESTORED
          - UNKNOWN
        retractionVersion: *id003
        assignmentId:
          $ref: assignment-submissions.yaml#/components/schemas/Id
        assignmentTitle:
          type: string
          minLength: 1
          maxLength: 200
        assignmentState:
          type: string
          enum:
          - DRAFT
          - OPEN
          - CLOSED
          - RETIRED
        studyId:
          $ref: assignment-submissions.yaml#/components/schemas/Id
        studyTitle:
          type: string
          minLength: 1
          maxLength: 200
        courseState:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - COMPLETED
          - RETIRED
    Page:
      type: object
      additionalProperties: false
      required:
      - items
      - nextAfter
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Row'
        nextAfter:
          anyOf:
          - *id001
          - type: 'null'
