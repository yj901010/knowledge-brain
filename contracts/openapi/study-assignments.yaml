components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-brain_guest
  schemas:
    Id:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    Assignment:
      type: object
      additionalProperties: false
      required:
      - assignmentId
      - studyId
      - groupId
      - spaceId
      - creatorId
      - version
      - title
      - description
      - state
      - visibility
      - createdAt
      - updatedAt
      properties:
        assignmentId:
          $ref: '#/components/schemas/Id'
        groupId:
          $ref: '#/components/schemas/Id'
        spaceId:
          $ref: '#/components/schemas/Id'
        creatorId:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          description: UTF-8 at most 32768 bytes, valid Unicode, no NUL
        state:
          enum:
          - DRAFT
          - OPEN
          - CLOSED
          - RETIRED
        visibility:
          const: PRIVATE
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        studyId:
          $ref: '#/components/schemas/Id'
    Summary:
      type: object
      additionalProperties: false
      required:
      - assignmentId
      - version
      - title
      - state
      properties:
        assignmentId:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          maxLength: 200
        state:
          enum:
          - DRAFT
          - OPEN
          - CLOSED
          - RETIRED
    Settings:
      type: object
      additionalProperties: false
      required:
      - title
      - description
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Nonblank, no control characters; preserved literally
        description:
          type: string
          description: UTF-8 <=32768 bytes, valid Unicode, no NUL
    StateInput:
      type: object
      additionalProperties: false
      required:
      - state
      properties:
        state:
          enum:
          - OPEN
          - CLOSED
    Page:
      type: object
      additionalProperties: false
      required:
      - items
      - nextAfter
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Summary'
        nextAfter:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
    Revision:
      type: object
      additionalProperties: false
      required:
      - revisionId
      - version
      - actorId
      - occurredAt
      - snapshot
      properties:
        revisionId:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          format: int64
          minimum: 1
        actorId:
          $ref: '#/components/schemas/Id'
        occurredAt:
          type: string
          format: date-time
        snapshot:
          $ref: '#/components/schemas/Assignment'
    History:
      type: object
      additionalProperties: false
      required:
      - items
      - nextBefore
      properties:
        items:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Revision'
        nextBefore:
          oneOf:
          - type: integer
            format: int64
            minimum: 1
          - type: 'null'
