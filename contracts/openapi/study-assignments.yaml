openapi: 3.1.0
info:
  title: Private Group Study Assignments
  version: 1.0.0
  description: Collaboration-owned Study Assignment definitions, separate from personal
    Planning tasks, Learning progress and Submission. Registered active OWNER/MEMBER/VIEWER
    read all states including DRAFT and immutable history; only OWNER writes after
    fresh Space participation and exact ACTIVE Group/Space checks. DRAFT -> OPEN ->
    CLOSED, RETIRED archive from any state; no reopening. Metadata corrections allowed
    until archived. Archived parent Study prohibits new assignments and actual changes;
    exact state retry with current ETag is a no-op. Assignment asN version is independent
    of Study stN; stale version 412, missing 428. Creation key scoped to Study/creator,
    exact original title/description replays current state even after edits, child/parent
    archive or process restart; changed input 409. Group -> Study -> Assignment row
    locks serialize parent archive and mutations. Snapshot, immutable revision and
    Outbox commit in one local transaction. collaboration.assignment.v1 / collaboration/assignment-events/1.
    Strict bounded JSON, keyset/history pagination, no-store, same-origin HTTPS writes,
    trace propagation. No private data copied, deadline, submission, assessment or
    personal completion in this slice.
security:
- browserSession: []
paths:
  /api/groups/{groupId}/studies/{studyId}/assignments:
    parameters:
    - name: groupId
      in: path
      schema:
        $ref: '#/components/schemas/Id'
      required: true
    - name: studyId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    get:
      operationId: listStudyAssignments
      responses:
        '200':
          description: Freshly authorized Study Assignment result
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          description: Invalid UUID/body/query/key/strong assignment ETag
        '401':
          description: Invalid session
        '403':
          description: Registered account required; only OWNER can write; same-origin
            HTTPS required
        '404':
          description: Membership/config/Space or exact scoped Study/Assignment unavailable
        '409':
          description: Changed original creation intent, invalid lifecycle, or archived
            Study/Assignment
        '412':
          description: Stale Assignment asN version
        '413':
          description: Body >65536 bytes
        '415':
          description: JSON required
        '428':
          description: If-Match required
        '503':
          description: Space authority or Collaboration persistence unavailable
      parameters:
      - name: after
        in: query
        schema:
          $ref: '#/components/schemas/Id'
        required: false
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        required: false
    post:
      operationId: createStudyAssignment
      responses:
        '200':
          description: Freshly authorized Study Assignment result
          headers:
            Cache-Control:
              schema:
                const: no-store
            ETag:
              schema:
                type: string
                pattern: ^"as[1-9][0-9]*"$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '400':
          description: Invalid UUID/body/query/key/strong assignment ETag
        '401':
          description: Invalid session
        '403':
          description: Registered account required; only OWNER can write; same-origin
            HTTPS required
        '404':
          description: Membership/config/Space or exact scoped Study/Assignment unavailable
        '409':
          description: Changed original creation intent, invalid lifecycle, or archived
            Study/Assignment
        '412':
          description: Stale Assignment asN version
        '413':
          description: Body >65536 bytes
        '415':
          description: JSON required
        '428':
          description: If-Match required
        '503':
          description: Space authority or Collaboration persistence unavailable
        '201':
          description: Freshly authorized Study Assignment result
          headers:
            Cache-Control:
              schema:
                const: no-store
            ETag:
              schema:
                type: string
                pattern: ^"as[1-9][0-9]*"$
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
      parameters:
      - name: Origin
        in: header
        schema:
          type: string
        required: true
      - name: Idempotency-Key
        in: header
        schema:
          type: string
          pattern: ^[0-9a-f]{32}$
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
