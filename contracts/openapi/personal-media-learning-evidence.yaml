openapi: 3.1.0
info:
  title: Private Media Learning Evidence
  version: 1.0.0
  description: Learning-owned private node-to-sealed-Media-version relationship. Same
    PRIVATE PERSONAL Space; common guest/registered identity and Space claim preserve
    IDs. Note and Concept v1 endpoints and events remain unchanged.
servers:
- url: https://localhost:8443
security:
- sessionCookie: []
paths:
  /api/spaces/{spaceId}/roadmaps/{roadmapId}/media-evidence:
    parameters:
    - &id014
      name: spaceId
      in: path
      required: true
      schema: &id001
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    - &id015
      name: roadmapId
      in: path
      required: true
      schema: *id001
    get:
      operationId: listPersonalMediaLearningEvidence
      description: Fresh ROADMAP_READ authorization. ACTIVE evidence, ascending UUIDv7
        keyset, includes archived-node pins. Retired roots remain auditable. No read
        writes or automatic completion.
      parameters:
      - name: after
        in: query
        required: false
        schema: *id001
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidencePage'
        '400': &id002
          description: Invalid strict JSON, UUIDv7, key, ETag, duplicate/unknown query,
            memo or numeric version
          headers:
            Cache-Control:
              schema:
                const: no-store
        '401': &id003
          description: Common browser credential unavailable
          headers:
            Cache-Control:
              schema:
                const: no-store
        '403': &id004
          description: Origin or current Space role denied
          headers:
            Cache-Control:
              schema:
                const: no-store
        '404': &id005
          description: Current Space/root/node/media/media-evidence unavailable for
            this operation
          headers:
            Cache-Control:
              schema:
                const: no-store
        '409': &id006
          description: Different payload or evidence kind for the same request key;
            active duplicate node/media/version; PENDING upload or current Media version
            differs.
          headers:
            Cache-Control:
              schema:
                const: no-store
        '412': &id007
          description: Evidence ETag is stale
          headers:
            Cache-Control:
              schema:
                const: no-store
        '413': &id008
          description: Body over 65536 bytes
          headers:
            Cache-Control:
              schema:
                const: no-store
        '415': &id009
          description: JSON required
          headers:
            Cache-Control:
              schema:
                const: no-store
        '428': &id010
          description: Strong meN If-Match required
          headers:
            Cache-Control:
              schema:
                const: no-store
        '503': &id011
          description: Owner authorization/reference check or persistence unavailable;
            no partial write
          headers:
            Cache-Control:
              schema:
                const: no-store
    post:
      operationId: linkMediaLearningEvidence
      description: 'Fresh ROADMAP_WRITE and same-origin required. Learning root lock
        serializes local writes. For a new request Media independently authorizes
        the same common credential and returns AVAILABLE same-Space PRIVATE Media
        metadata. Expected mediaVersion must match current. Pin filename/version,
        MIME, size and SHA-256, never object keys or signed URLs. Node must be active.
        UUIDv7 evidence/revision/event generated by Learning; atomically commit relationship,
        full revision and Protobuf Outbox. Same key+original payload replays CURRENT
        evidence with 200, including retired evidence/root, without an external check
        or another event. New creates return 201. Unique active node/media/version
        pin prevents duplicates with different keys. Owner check and local commit
        are not a distributed transaction: later source changes do not alter the pin.'
      parameters:
      - &id016
        name: Origin
        in: header
        required: true
        schema:
          type: string
          const: https://localhost:8443
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{32}$
      responses:
        '201':
          description: Success
          headers: &id012
            Cache-Control:
              schema:
                const: no-store
            ETag:
              schema:
                type: string
                pattern: ^"ev[1-9][0-9]*"$
            Location:
              schema:
                type: string
          content: &id013
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '412': *id007
        '413': *id008
        '415': *id009
        '428': *id010
        '503': *id011
        '200':
          description: Success
          headers: *id012
          content: *id013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvidence'
  /api/spaces/{spaceId}/roadmaps/{roadmapId}/media-evidence/{evidenceId}:
    parameters:
    - *id014
    - *id015
    - name: evidenceId
      in: path
      required: true
      schema: *id001
    get:
      operationId: readPersonalMediaLearningEvidence
      description: Fresh Space read. ACTIVE evidence remains readable after node,
        Media or root retirement. Retained metadata describes the linking instant,
        never current Media availability.
      parameters: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                const: no-store
            ETag:
              schema:
                type: string
                pattern: ^"ev[1-9][0-9]*"$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '412': *id007
        '413': *id008
        '415': *id009
        '428': *id010
        '503': *id011
    put:
      operationId: editPersonalMediaLearningEvidenceMemo
      description: Memo-only replacement with independent strong meN ETag. ACTIVE
        root required; archived node/Media does not prevent audit correction. Source/node
        pins never change. Same memo no-op still checks expected version, no new revision/event.
      parameters:
      - *id016
      - &id017
        name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: ^"ev[1-9][0-9]{0,18}"$
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                const: no-store
            ETag:
              schema:
                type: string
                pattern: ^"ev[1-9][0-9]*"$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '412': *id007
        '413': *id008
        '415': *id009
        '428': *id010
        '503': *id011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditEvidence'
    delete:
      operationId: retirePersonalMediaLearningEvidence
      description: Soft retirement with active root, empty body and strong meN. Preserve
        snapshots and pinned references. No mutation of Media, Progress, Session or
        Roadmap.
      parameters:
      - *id016
      - *id017
      responses:
        '204':
          description: Success
          headers:
            Cache-Control:
              schema:
                const: no-store
            ETag:
              schema:
                type: string
                pattern: ^"ev[1-9][0-9]*"$
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '412': *id007
        '413': *id008
        '415': *id009
        '428': *id010
        '503': *id011
  /api/spaces/{spaceId}/roadmaps/{roadmapId}/media-evidence/{evidenceId}/revisions:
    parameters:
    - *id014
    - *id015
    - name: evidenceId
      in: path
      required: true
      schema: *id001
    get:
      operationId: readPersonalMediaLearningEvidenceHistory
      description: Known evidence including retired rows/root/node. Fresh Space access
        every request. Descending version keyset; immutable actor and full pins/memo
        snapshots.
      parameters:
      - name: before
        in: query
        required: false
        schema: &id018
          type: integer
          format: int64
          minimum: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: '#/components/schemas/Revision'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '412': *id007
        '413': *id008
        '415': *id009
        '428': *id010
        '503': *id011
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-brain_guest
  schemas:
    Evidence:
      type: object
      additionalProperties: false
      required:
      - evidenceId
      - roadmapId
      - spaceId
      - nodeId
      - nodeTitle
      - visibility
      - state
      - version
      - mediaId
      - mediaVersion
      - mediaFilename
      - memo
      - createdAt
      - updatedAt
      - mimeType
      - byteSize
      - sha256
      properties:
        evidenceId: *id001
        roadmapId: *id001
        spaceId: *id001
        nodeId: *id001
        nodeTitle: &id019
          type: string
          minLength: 1
          maxLength: 200
        visibility:
          const: PRIVATE
        state:
          enum:
          - ACTIVE
          - RETIRED
        version: *id018
        mediaId: *id001
        mediaVersion: *id018
        mediaFilename: *id019
        memo: &id021
          type: string
          description: Raw text, at most 8192 UTF-8 bytes; no disallowed controls.
        createdAt: &id020
          type: string
          format: date-time
        updatedAt: *id020
        mimeType:
          type: string
          enum:
          - application/pdf
          - application/octet-stream
          - image/png
          - image/jpeg
          - image/gif
          - image/webp
        byteSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    CreateEvidence:
      type: object
      additionalProperties: false
      required:
      - nodeId
      - mediaId
      - mediaVersion
      - memo
      properties:
        nodeId: *id001
        mediaId: *id001
        mediaVersion: *id018
        memo: *id021
    EditEvidence:
      type: object
      additionalProperties: false
      required:
      - memo
      properties:
        memo: *id021
    EvidencePage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextAfter
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Evidence'
        nextAfter:
          oneOf:
          - *id001
          - type: 'null'
    Revision:
      type: object
      additionalProperties: false
      required:
      - revisionId
      - evidenceId
      - version
      - actorId
      - occurredAt
      - snapshot
      properties:
        revisionId: *id001
        evidenceId: *id001
        version: *id018
        actorId: *id001
        occurredAt: *id020
        snapshot:
          $ref: '#/components/schemas/Evidence'
