components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-brain_guest
  schemas:
    Id:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    Discussion:
      type: object
      additionalProperties: false
      required:
      - discussionId
      - studyId
      - groupId
      - spaceId
      - creatorId
      - version
      - title
      - description
      - state
      - audience
      - createdAt
      - updatedAt
      properties:
        discussionId:
          $ref: '#/components/schemas/Id'
        studyId:
          $ref: '#/components/schemas/Id'
        groupId:
          $ref: '#/components/schemas/Id'
        spaceId:
          $ref: '#/components/schemas/Id'
        creatorId:
          $ref: '#/components/schemas/Id'
        version: *id015
        title: &id017
          type: string
          minLength: 1
          maxLength: 200
          description: Nonblank valid Unicode, no controls, literal text
        description: &id019
          type: string
          description: Valid Unicode/no NUL; UTF-8 <=32768 bytes
        state: &id018
          enum:
          - OPEN
          - LOCKED
          - RETIRED
        audience:
          const: GROUP_MEMBERS
        createdAt: &id016
          type: string
          format: date-time
        updatedAt: *id016
    Summary:
      type: object
      additionalProperties: false
      required:
      - discussionId
      - creatorId
      - version
      - title
      - state
      properties:
        discussionId:
          $ref: '#/components/schemas/Id'
        creatorId:
          $ref: '#/components/schemas/Id'
        version: *id015
        title: *id017
        state: *id018
    Input:
      type: object
      additionalProperties: false
      required:
      - title
      - description
      properties:
        title: *id017
        description: *id019
    StateInput:
      type: object
      additionalProperties: false
      required:
      - state
      properties:
        state:
          enum:
          - OPEN
          - LOCKED
    ReplyInput:
      type: object
      additionalProperties: false
      required:
      - content
      properties:
        content: &id020
          type: string
          description: Nonblank valid Unicode/no NUL; UTF-8 <=32768 bytes
    Reply:
      type: object
      additionalProperties: false
      required:
      - replyId
      - discussionId
      - studyId
      - groupId
      - spaceId
      - authorId
      - version
      - discussionVersion
      - content
      - audience
      - createdAt
      properties:
        replyId:
          $ref: '#/components/schemas/Id'
        discussionId:
          $ref: '#/components/schemas/Id'
        studyId:
          $ref: '#/components/schemas/Id'
        groupId:
          $ref: '#/components/schemas/Id'
        spaceId:
          $ref: '#/components/schemas/Id'
        authorId:
          $ref: '#/components/schemas/Id'
        version:
          const: 1
        discussionVersion: *id015
        content: *id020
        audience:
          const: GROUP_MEMBERS
        createdAt: *id016
    Page:
      type: object
      additionalProperties: false
      required:
      - items
      - nextAfter
      - canWrite
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Summary'
        nextAfter:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        canWrite:
          type: boolean
          description: Fresh OWNER/MEMBER role and nonarchived Study, checked again
            on every write
    Replies:
      type: object
      additionalProperties: false
      required:
      - items
      - nextAfter
      properties:
        items:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Reply'
        nextAfter:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
    Revision:
      type: object
      additionalProperties: false
      required:
      - revisionId
      - version
      - actorId
      - occurredAt
      - snapshot
      properties:
        revisionId:
          $ref: '#/components/schemas/Id'
        version: *id015
        actorId:
          $ref: '#/components/schemas/Id'
        occurredAt: *id016
        snapshot:
          $ref: '#/components/schemas/Discussion'
    History:
      type: object
      additionalProperties: false
      required:
      - items
      - nextBefore
      properties:
        items:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Revision'
        nextBefore:
          oneOf:
          - *id015
          - type: 'null'
