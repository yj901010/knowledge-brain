openapi: 3.1.0
info:
  title: Course assignments with own submission presence
  version: 1.0.0
  description: Fresh current registered Group participant, including VIEWER, reads
    assignments only through current canonical Course curriculum bindings and only
    own submission presence. Independent of Course enrollment/private progress; shared
    Course and Study read rights still apply. OPEN_NOT_SUBMITTED default requires
    OPEN Assignment, non-RETIRED Course/Study and no own submission. OPEN also excludes
    archived parents. ALL/SUBMITTED/NOT_SUBMITTED retain existing shared DRAFT/closed/archive
    reads. Eleven metadata fields include current Study ID/title and Course state;
    original pinned Course snapshots are unchanged. No peer roster/count, answer/score/reason,
    obligation/deadline/completion inference. Exact Group/Space/Course/Study/Assignment
    tuples and actor in LEFT JOIN, one local Collaboration statement, filter before
    ascending Assignment UUIDv7 keyset/default20/max100/limit+1. Current pages may
    change after curriculum/source writes. Explicit navigation rechecks current curriculum
    and original source rights. No mutation, enrollment, new event/migration/dependency,
    cross-owner SQL, notification or progress sharing. Existing endpoints unchanged.
servers:
- url: https://localhost:8443
security:
- browserSession: []
paths:
  /api/groups/{groupId}/courses/{courseId}/my-assignments:
    parameters:
    - name: groupId
      in: path
      required: true
      schema: &id001
        $ref: assignment-submissions.yaml#/components/schemas/Id
    - name: courseId
      in: path
      required: true
      schema: *id001
    get:
      operationId: getCourseAssignmentsWithOwnSubmission
      parameters:
      - name: filter
        in: query
        schema:
          type: string
          enum:
          - OPEN_NOT_SUBMITTED
          - ALL
          - OPEN
          - SUBMITTED
          - NOT_SUBMITTED
          default: OPEN_NOT_SUBMITTED
      - name: after
        in: query
        schema: *id001
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '400':
          description: Malformed/singleton query, limit, cursor or nonempty GET body
        '401':
          description: Secure singleton browser session required
        '403':
          description: Registered Group participation required
        '404':
          description: Missing current Group participation or exact parent scope
        '503':
          description: Space authority unavailable
        '200':
          description: Current curriculum assignment metadata with only own presence;
            eleven fields
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-brain_guest
  schemas:
    Row:
      type: object
      additionalProperties: false
      required:
      - assignmentId
      - title
      - state
      - version
      - studyState
      - submissionId
      - submissionVersion
      - submittedAssignmentVersion
      - studyId
      - studyTitle
      - courseState
      properties:
        assignmentId: &id002
          $ref: assignment-submissions.yaml#/components/schemas/Id
        title:
          type: string
          minLength: 1
          maxLength: 200
        state:
          type: string
          enum:
          - DRAFT
          - OPEN
          - CLOSED
          - RETIRED
        version:
          type: integer
          format: int64
          minimum: 1
        studyState:
          type: string
          enum:
          - PLANNED
          - ACTIVE
          - COMPLETED
          - RETIRED
        submissionId:
          anyOf:
          - *id002
          - type: 'null'
        submissionVersion: &id003
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        submittedAssignmentVersion: *id003
        studyId:
          $ref: assignment-submissions.yaml#/components/schemas/Id
        studyTitle:
          type: string
          minLength: 1
          maxLength: 200
        courseState:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - COMPLETED
          - RETIRED
    Page:
      type: object
      additionalProperties: false
      required:
      - items
      - nextAfter
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Row'
        nextAfter:
          anyOf:
          - *id001
          - type: 'null'
