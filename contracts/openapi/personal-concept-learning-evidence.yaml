openapi: 3.1.0
info:
  title: Private Personal Concept Learning Evidence
  version: 1.0.0
  description: Learning owns the private Roadmap node-to-Concept-version evidence
    variant. Same-private-Space or authorized PUBLIC Concept, checked by Knowledge
    over HTTPS with the common principal. No cross-service SQL/FK or copy of canonical
    description/Claims. Separate typed API/topic preserves the Note Evidence v1 JSON
    and wire contracts. Both variants share Learning evidence/revision tables and
    root lock; IDs never move or recreate.
servers:
- url: https://localhost:8443
security:
- sessionCookie: []
paths:
  /api/spaces/{spaceId}/roadmaps/{roadmapId}/concept-evidence:
    parameters:
    - name: spaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    - name: roadmapId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    get:
      operationId: conceptListPersonalLearningEvidence
      description: Fresh ROADMAP_READ. ACTIVE CONCEPT variant only, ascending evidence
        UUID keyset, default20/max100. NOTE rows remain on the unchanged Note evidence
        API. Root/node/source retirement retains the known audit view. No writes on
        read.
      parameters:
      - name: after
        in: query
        required: false
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidencePage'
        '400':
          description: Invalid strict JSON, UUIDv7, key, ETag, duplicate/unknown query,
            memo or numeric version
          headers:
            Cache-Control:
              schema:
                const: no-store
        '401':
          description: Common browser credential unavailable
          headers:
            Cache-Control:
              schema:
                const: no-store
        '403':
          description: Origin or current Space role denied
          headers:
            Cache-Control:
              schema:
                const: no-store
        '404':
          description: Current Space/root/node/concept/concept-evidence unavailable
            for this operation
          headers:
            Cache-Control:
              schema:
                const: no-store
        '409':
          description: Request key payload/kind collision, active duplicate Concept
            pin or changed current source version
          headers:
            Cache-Control:
              schema:
                const: no-store
        '412':
          description: Evidence ETag is stale
          headers:
            Cache-Control:
              schema:
                const: no-store
        '413':
          description: Body over 65536 bytes
          headers:
            Cache-Control:
              schema:
                const: no-store
        '415':
          description: JSON required
          headers:
            Cache-Control:
              schema:
                const: no-store
        '428':
          description: Strong ceN If-Match required
          headers:
            Cache-Control:
              schema:
                const: no-store
        '503':
          description: Owner authorization/reference check or persistence unavailable;
            no partial write
          headers:
            Cache-Control:
              schema:
                const: no-store
    post:
      operationId: conceptLinkConceptLearningEvidence
      description: Fresh ROADMAP_WRITE and same origin; exact body nodeId/conceptSpaceId/conceptId/conceptVersion/memo.
        Active root/node required for a new link. Knowledge independently authorizes
        the destination private Personal Space, selects only an ACTIVE same-private-Space
        or PUBLIC Concept, and additionally authorizes the current PUBLIC source Space
        when applicable. Same principal required across checks. Expected source Space
        mismatch is 404; changed Concept version is 409. Pin source ID/Space/version/title/visibility
        and node title at linking. Public sources produce PRIVATE learning evidence
        and never publish the memo. No source description or Claims are copied, nor
        medical verification, mastery, completion or ranking inferred. Local row/revision/Protobuf
        Outbox commit is atomic; owner check and commit are not a distributed transaction.
        Source edits/retirement after check do not update the pin. 201 new, 200 current
        original-key replay without owner recheck, including retired records/root/source.
        Same key with another payload OR other evidence kind is 409; duplicate active
        node/Concept-Space/Concept/version pin under a different key is 409. Request
        keys are shared across both variants within a Roadmap. Server UUIDv7 IDs only.
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
          const: https://localhost:8443
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{32}$
      responses:
        '201':
          description: Success
          headers:
            Cache-Control:
              schema:
                const: no-store
            ETag:
              schema:
                type: string
                pattern: ^"ce[1-9][0-9]*"$
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '400':
          description: Invalid strict JSON, UUIDv7, key, ETag, duplicate/unknown query,
            memo or numeric version
          headers:
            Cache-Control:
              schema:
                const: no-store
        '401':
          description: Common browser credential unavailable
          headers:
            Cache-Control:
              schema:
                const: no-store
        '403':
          description: Origin or current Space role denied
          headers:
            Cache-Control:
              schema:
                const: no-store
        '404':
          description: Current Space/root/node/concept/concept-evidence unavailable
            for this operation
          headers:
            Cache-Control:
              schema:
                const: no-store
        '409':
          description: Request key payload/kind collision, active duplicate Concept
            pin or changed current source version
          headers:
            Cache-Control:
              schema:
                const: no-store
        '412':
          description: Evidence ETag is stale
          headers:
            Cache-Control:
              schema:
                const: no-store
        '413':
          description: Body over 65536 bytes
          headers:
            Cache-Control:
              schema:
                const: no-store
        '415':
          description: JSON required
          headers:
            Cache-Control:
              schema:
                const: no-store
        '428':
          description: Strong ceN If-Match required
          headers:
            Cache-Control:
              schema:
                const: no-store
        '503':
          description: Owner authorization/reference check or persistence unavailable;
            no partial write
          headers:
            Cache-Control:
              schema:
                const: no-store
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                const: no-store
            ETag:
              schema:
                type: string
                pattern: ^"ce[1-9][0-9]*"$
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvidence'
