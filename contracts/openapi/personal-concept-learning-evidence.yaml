    get:
      operationId: conceptReadPersonalLearningEvidenceHistory
      description: Fresh destination Space read, known CONCEPT evidence including
        retired root/node/source/record. Immutable full pin, memo and actor snapshots;
        descending before version cursor, default5/max10. NOTE IDs do not resolve
        here.
      parameters:
      - name: before
        in: query
        required: false
        schema:
          type: integer
