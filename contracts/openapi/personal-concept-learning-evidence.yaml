components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-brain_guest
  schemas:
    Evidence:
      type: object
      additionalProperties: false
      required:
      - evidenceId
      - roadmapId
      - spaceId
      - nodeId
      - nodeTitle
      - visibility
      - state
      - version
      - conceptId
      - conceptVersion
      - conceptTitle
      - memo
      - createdAt
      - updatedAt
      - conceptSpaceId
      - conceptVisibility
      properties:
        evidenceId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        roadmapId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        spaceId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        nodeId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        nodeTitle:
          type: string
          minLength: 1
          maxLength: 200
        visibility:
          const: PRIVATE
        state:
          enum:
          - ACTIVE
          - RETIRED
        version:
          type: integer
          format: int64
          minimum: 1
        conceptId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        conceptVersion:
          type: integer
          format: int64
          minimum: 1
        conceptTitle:
          type: string
          minLength: 1
          maxLength: 200
        memo:
          type: string
          description: Raw text, at most 8192 UTF-8 bytes; no disallowed controls.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        conceptSpaceId: &id001
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        conceptVisibility:
          enum:
          - PRIVATE
          - PUBLIC
    CreateEvidence:
      type: object
      additionalProperties: false
      required:
      - nodeId
      - conceptId
      - conceptVersion
      - memo
      - conceptSpaceId
      properties:
        nodeId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        conceptId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        conceptVersion:
          type: integer
          format: int64
          minimum: 1
        memo:
          type: string
          description: Raw text, at most 8192 UTF-8 bytes; no disallowed controls.
        conceptSpaceId: *id001
    EditEvidence:
      type: object
      additionalProperties: false
      required:
      - memo
      properties:
        memo:
          type: string
          description: Raw text, at most 8192 UTF-8 bytes; no disallowed controls.
    EvidencePage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextAfter
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Evidence'
        nextAfter:
          oneOf:
          - type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          - type: 'null'
    Revision:
      type: object
      additionalProperties: false
      required:
      - revisionId
      - evidenceId
      - version
      - actorId
      - occurredAt
      - snapshot
      properties:
        revisionId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        evidenceId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        version:
          type: integer
          format: int64
          minimum: 1
        actorId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        occurredAt:
          type: string
          format: date-time
        snapshot:
          $ref: '#/components/schemas/Evidence'
