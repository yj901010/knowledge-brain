      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
        description: Plain title/Markdown text; nonblank and no control characters.
          Not query DSL.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 999
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        '200':
          description: 'Private Space search page; Cache-Control: no-store'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - total
                - offset
                - limit
                - nextOffset
                - items
                properties:
                  total:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Exact count of PRIVATE ACTIVE matching notes in the
                      authorized Space.
                  offset:
                    type: integer
                  limit:
                    type: integer
                  nextOffset:
                    type:
                    - integer
                    - 'null'
                  items:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - noteId
                      - title
                      properties:
                        noteId:
                          type: string
                          format: uuid
                        title:
                          type: string
                          maxLength: 200
        '400':
          description: Invalid UUID, query, duplicate/unknown parameter or page window
        '401':
          description: Missing, invalid, expired or revoked guest credential
        '403':
          description: Read access denied
        '404':
          description: Space unavailable; does not reveal another Space
        '503':
          description: Authority or search storage unavailable; never partial results
  /api/spaces/{spaceId}/graph/notes:
    get:
      operationId: readPrivateNoteGraph
      description: 'Fresh Space NOTE_GRAPH authorization before every read. PRIVATE
        PERSONAL only. Derived eventual graph: ACTIVE nodes and RESOLVED links between
        selected same-Space nodes. No Markdown, global totals or unresolved labels.
        Readiness/storage/authority outages fail closed; no-store.'
      parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
      responses:
        '200':
          description: Bounded same-Space graph
          content:
            application/json:
              schema:
                type: object
                required:
                - nodes
                - links
                - truncated
                additionalProperties: false
                properties:
                  nodes:
                    type: array
                    maxItems: 200
                    items:
                      type: object
                      required:
                      - noteId
                      - title
                      additionalProperties: false
                      properties:
                        noteId:
                          type: string
                          format: uuid
                        title:
                          type: string
                          maxLength: 200
                  links:
                    type: array
                    maxItems: 1000
                    items:
                      type: object
                      required:
                      - linkId
                      - sourceNoteId
                      - targetNoteId
                      additionalProperties: false
                      properties:
                        linkId:
                          type: string
                          format: uuid
                        sourceNoteId:
                          type: string
                          format: uuid
                        targetNoteId:
                          type: string
                          format: uuid
                  truncated:
                    type: boolean
        '400':
          description: Invalid or duplicate query
        '401':
          description: Guest credential missing, invalid or revoked
        '404':
          description: Space unavailable; no graph fields
        '503':
          description: Authority, graph readiness or storage unavailable; no graph
            fields
        '403':
          description: Access denied; no graph fields
  /api/spaces/{spaceId}/concepts:
    parameters:
