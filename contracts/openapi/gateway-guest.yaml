              schema:
                $ref: '#/components/schemas/Error'
      security: &id001
      - guestCookie: []
  /api/spaces/{spaceId}:
    get:
      operationId: getAuthorizedSpace
      parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Space visible to the verified member; no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisibleSpace'
        '404':
          description: Space does not exist or principal has no active membership;
