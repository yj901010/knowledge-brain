  /api/spaces/{spaceId}/daily-notes:
    parameters:
    - &id008
      name: spaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      summary: Open or create the unique Daily Note for a Space calendar date
      description: No overwrite on repeated opens. Immutable initial timezone. A retired
        date cannot be recreated. Body <=1 KiB. Same-origin HTTPS required; uses existing
        NOTE_WRITE authority. Location references the canonical Note; ETag is its
        Markdown version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - date
              - timezone
              properties:
                date: &id007
                  type: string
                  format: date
                  pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
                timezone: &id009
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Explicit TZDB/IANA ZoneId, for example Asia/Seoul or
                    UTC. Fixed-offset strings are rejected.
            example:
              date: '2026-10-07'
              timezone: Asia/Seoul
      responses:
        '201':
          description: Created atomically with Note and events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyNoteEntry'
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
            ETag:
              schema:
                type: string
              example: '"1"'
            Location:
              schema:
                type: string
              description: Canonical Note resource path
        '200':
          description: Existing Note returned unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyNoteEntry'
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
            ETag:
              schema:
                type: string
              example: '"1"'
            Location:
              schema:
                type: string
              description: Canonical Note resource path
        '400':
          description: Invalid date, timezone or JSON
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
        '401':
          description: Unauthenticated
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
        '403':
          description: Invalid Origin
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
        '404':
          description: Unauthorized Space
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
        '409':
          description: Timezone conflict or retired Daily Note
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
        '413':
          description: Body exceeds 1 KiB
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
        '415':
          description: JSON required
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
        '503':
          description: Authorization dependency unavailable
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
      security:
      - guestCookie: []
    get:
      summary: List private Journal entries by descending calendar date
      parameters:
      - name: from
        in: query
        schema: *id007
      - name: to
        in: query
        schema: *id007
      - name: before
        in: query
        schema: *id007
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
