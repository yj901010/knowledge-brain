  /api/spaces/personal:
    get:
      operationId: getPersonalSpace
      description: Resolves the browser credential through Identity over verified
        HTTPS, then reads only Space-owned data. Principal/user headers are ignored.
        No credential cache is used. Responses are no-store.
      responses:
        '200':
          description: Active private Personal Space and membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '202':
          description: Identity is valid but asynchronous provisioning has not completed;
            empty body
          headers:
            Retry-After:
              schema:
                type: string
                const: '1'
        '400':
          description: Invalid request; query strings are not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, malformed, expired, retired or revoked credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Request not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authentication or persistence unavailable
          content:
            application/json:
