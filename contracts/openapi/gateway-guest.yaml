        '503': &id016
          description: Authority/storage unavailable; no mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: after
        in: query
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    post:
      responses:
        '400': *id013
        '401': *id014
        '404': *id015
        '503': *id016
        '201':
          description: Created PRIVATE Concept with version 1 and strong ETag
          content:
