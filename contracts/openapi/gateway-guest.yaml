openapi: 3.1.0
info:
  title: Knowledge Brain Public Gateway API
  version: 1.1.0
  description: Fixed HTTPS routing to owning Identity/Space services. Cookie authentication
    and Space authorization are enforced by those services. No internal introspection
    route, redirect, query routing or arbitrary upstream URL. Wiki Links and backlinks
    are Content-owned and Space-authorized; GET metadata is private.
servers:
- url: https://localhost:8443
  description: Common local HTTPS Gateway, via Kubernetes port-forward; trust local
    CA
paths:
  /api/spaces/{spaceId}/roadmaps/{roadmapId}/learning-guidance:
    $ref: './personal-learning-guidance.yaml#/paths/~1api~1spaces~1{spaceId}~1roadmaps~1{roadmapId}~1learning-guidance'
  /api/identity/guest-session:
    post:
      operationId: createOrRestoreGuestSession
      description: 'No cookie creates one guest and Outbox atomically. A valid existing
        cookie restores the same principal without another event. Invalid cookies
        return 401 without replacing the identity. No token appears in the JSON body.
        Space provisioning is asynchronous. Responses use Cache-Control: no-store.
        HTTPS is required.'
      security: []
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
          format: uri
        description: Exact configured HTTPS browser origin. Missing, null, duplicate
          and other origins are rejected; cross-site Sec-Fetch-Site is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              maxProperties: 0
      responses:
        '201':
          description: Guest created; credential expires after 180 days
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestPrincipal'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Secure host-only browser cookie; only issuance exposes
                the credential
        '200':
          description: Existing guest restored; cookie lifetime is not extended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestPrincipal'
        '400':
          description: Invalid request; query strings are not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, malformed, expired, retired or revoked credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Request not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authentication or persistence unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Configured upstream unavailable or invalid response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Complete upstream response deadline exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Guest API request exceeds 1 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Browser mutation requires application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: getGuestSession
      security:
      - guestCookie: []
      responses:
        '200':
          description: 'Current active guest; Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestPrincipal'
        '400':
          description: Invalid request; query strings are not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, malformed, expired, retired or revoked credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Request not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authentication or persistence unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Configured upstream unavailable or invalid response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Complete upstream response deadline exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Guest API request exceeds 1 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Browser mutation requires application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/identity/guest-session/revoke:
    post:
      operationId: revokeGuestCredential
      description: Revokes the presented browser credential immediately and expires
        its cookie. Personal Space data is retained. A guest with no registered recovery
        loses access after revocation.
      security:
      - guestCookie: []
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
          format: uri
        description: Exact configured HTTPS browser origin. Missing, null, duplicate
          and other origins are rejected; cross-site Sec-Fetch-Site is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              maxProperties: 0
      responses:
        '204':
          description: Credential revoked and cookie expired
          headers:
            Set-Cookie:
              schema:
                type: string
        '400':
          description: Invalid request; query strings are not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, malformed, expired, retired or revoked credential
