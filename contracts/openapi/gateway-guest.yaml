components:
  securitySchemes:
    guestCookie:
      type: apiKey
      in: cookie
      name: __Host-brain_guest
  schemas:
    GuestPrincipal:
      type: object
      required:
      - principalId
      - kind
      - expiresAt
      properties:
        principalId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - GUEST
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    Error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    VisibleSpace:
      type: object
      description: Active Space and membership already authorized for this principal.
        Supported model kinds do not grant domain permissions or create new provisioning workflows.
      required:
      - spaceId
      - kind
      - visibility
      - role
      properties:
        spaceId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - PUBLIC
          - PERSONAL
          - GROUP
          - ORGANIZATION
        visibility:
          type: string
          enum:
          - PRIVATE
          - PUBLIC
        role:
          type: string
          enum:
          - OWNER
          - ADMIN
          - EDITOR
          - CONTRIBUTOR
          - REVIEWER
          - MEMBER
          - VIEWER
      if:
        properties:
          kind:
            const: PERSONAL
      then:
        properties:
          visibility:
            const: PRIVATE
      additionalProperties: false
    Space:
      type: object
      required:
      - spaceId
      - kind
      - visibility
      - role
      properties:
        spaceId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - PERSONAL
        visibility:
          type: string
          enum:
          - PRIVATE
        role:
          type: string
          enum:
          - OWNER
      additionalProperties: false
    ContentEdit:
      type: object
      additionalProperties: false
      required:
      - title
      - markdown
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Nonblank, no NUL; <=200 Unicode code points
        markdown:
          type: string
          description: Raw Markdown, no NUL, <=32768 UTF-8 bytes; never rendered by
            this API
    ContentNote:
      type: object
      required:
      - noteId
      - spaceId
      - visibility
      - state
      - version
      - title
      - markdown
      - createdAt
      - updatedAt
      properties:
        noteId:
          type: string
          format: uuid
          description: Canonical UUIDv7
        spaceId:
          type: string
          format: uuid
          description: Canonical UUIDv7
        visibility:
          type: string
          const: PRIVATE
        state:
          type: string
          enum:
          - ACTIVE
          - RETIRED
        version:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Nonblank, no NUL; <=200 Unicode code points
        markdown:
          type: string
          description: Raw Markdown, no NUL, <=32768 UTF-8 bytes; never rendered by
            this API
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ContentRevision:
      type: object
      required:
      - revisionId
      - noteId
      - version
      - state
      - title
      - markdown
      - actorId
      - occurredAt
      properties:
        revisionId:
          type: string
          format: uuid
          description: Canonical UUIDv7
        noteId:
          type: string
          format: uuid
          description: Canonical UUIDv7
        version:
          type: integer
          format: int64
        state:
          type: string
          enum:
          - ACTIVE
          - RETIRED
        title:
          type: string
        markdown:
          type: string
        actorId:
          type: string
          format: uuid
          description: Canonical UUIDv7
        occurredAt:
          type: string
          format: date-time
    ContentSummary:
      type: object
      required:
      - noteId
      - title
      - version
      - updatedAt
      properties:
        noteId:
          type: string
          format: uuid
          description: Canonical UUIDv7
        title:
          type: string
        version:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    ContentPage:
      type: object
      required:
      - items
      - nextAfter
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentSummary'
        nextAfter:
          type:
          - string
          - 'null'
          format: uuid
    ContentError:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    ContentWikiLink:
      type: object
      required:
      - linkId
      - ordinal
      - startOffset
      - endOffset
      - targetToken
      - label
      - fragment
      - targetNoteId
      - targetTitle
      - status
      properties:
        linkId:
          type: string
          format: uuid
          description: Canonical UUIDv7
        ordinal:
          type: integer
          minimum: 0
        startOffset:
          type: integer
          minimum: 0
          description: Inclusive UTF-16 code-unit offset in Markdown
        endOffset:
          type: integer
          description: Exclusive UTF-16 code-unit offset
        targetToken:
          type: string
        label:
          type:
          - string
          - 'null'
        fragment:
          type:
          - string
          - 'null'
        targetNoteId:
          type:
          - string
          - 'null'
          format: uuid
          description: Canonical UUIDv7
        targetTitle:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - UNRESOLVED
          - AMBIGUOUS
          - RESOLVED
          - TARGET_RETIRED
    ContentWikiLinkPage:
      type: object
      required:
      - noteVersion
      - linkVersion
      - items
      - nextAfter
      properties:
        noteVersion:
          type: integer
          format: int64
          minimum: 1
        linkVersion:
          type: integer
          format: int64
          minimum: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentWikiLink'
        nextAfter:
          type:
          - integer
          - 'null'
          minimum: 0
    ContentBacklink:
      type: object
      required:
      - sourceNoteId
      - title
      - version
      - linkCount
      properties:
        sourceNoteId:
          type: string
          format: uuid
          description: Canonical UUIDv7
        title:
          type: string
        version:
          type: integer
          format: int64
        linkCount:
          type: integer
          format: int64
          minimum: 1
    ContentBacklinkPage:
      type: object
      required:
      - items
      - nextAfter
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentBacklink'
        nextAfter:
          type:
          - string
          - 'null'
          format: uuid
          description: Canonical UUIDv7
    MetadataEdit:
      type: object
      additionalProperties: false
      required:
      - tags
      - properties
      properties:
        tags:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        properties:
          type: object
          maxProperties: 32
          additionalProperties:
            $ref: '#/components/schemas/TypedPropertyInput'
    TypedPropertyInput:
      type: object
      additionalProperties: false
      required:
      - type
      - value
      properties:
        type: &id019
          type: string
          enum:
          - STRING
          - NUMBER
          - BOOLEAN
          - DATE
          - STRING_LIST
        value: &id020
          oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: array
            items:
              type: string
      oneOf: &id021
      - properties:
          type:
            const: STRING
          value:
            type: string
            maxLength: 1000
      - properties:
          type:
            const: NUMBER
          value:
            type: number
      - properties:
          type:
            const: BOOLEAN
          value:
            type: boolean
      - properties:
          type:
            const: DATE
          value:
            type: string
            format: date
            pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      - properties:
          type:
            const: STRING_LIST
          value:
            type: array
            maxItems: 20
            items:
              type: string
              maxLength: 200
    NoteMetadata:
      type: object
      required:
      - noteId
      - metadataVersion
      - tags
      - properties
      properties:
        noteId:
          type: string
          format: uuid
        metadataVersion:
          type: integer
          minimum: 0
        tags:
          type: array
          items:
            type: object
            properties:
              tagId:
                type: string
                format: uuid
              name:
                type: string
        properties:
          type: array
          items:
            type: object
            properties:
              propertyId:
                type: string
                format: uuid
              name:
                type: string
              type: *id019
              value: *id020
            oneOf: *id021
    MetadataRevision:
      type: object
      properties:
        revisionId:
          type: string
          format: uuid
        metadataVersion:
          type: integer
        actorId:
          type: string
