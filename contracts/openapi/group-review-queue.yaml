openapi: 3.1.0
info:
  title: OWNER Group-wide feedback and resubmission review queue
  version: 1.0.0
  description: Fresh current registered Group OWNER only. Submitted feedback/request
    metadata across all canonical Studies in the exact Group/Space, independent of
    Course binding/enrollment/private progress. Permitted OWNER own review is included;
    separate grading queue/writers still forbid self-grading. Twenty fields exclude
    private text/reasons/scores/files. Existing six overview filters/default NEEDS_FEEDBACK
    and exact latest feedback-version annotation/atomic request normalization apply.
    UNAVAILABLE never means current feedback or pending/resolved request. Current
    Study/Assignment labels and mixed Study states retain submitted source versions.
    Local active Group/Space check then one canonical joined metadata snapshot, filter
    before Submission UUIDv7 keyset/default20/max100. Fresh Group OWNER check and
    exact original source navigation. Archived reads retain original writer restrictions.
    No roster, writes/events/migrations/dependencies, Course creation, unread tracking,
    notification or private progress mutation. Existing Assignment review API retains
    five filters/default ALL.
servers:
- url: https://localhost:8443
security:
- browserSession: []
paths:
  /api/groups/{groupId}/submissions/review-queue:
    parameters:
    - name: groupId
      in: path
      required: true
      schema: &id001
        $ref: assignment-submissions.yaml#/components/schemas/Id
    get:
      operationId: getOwnerGroupReviewQueue
      parameters:
      - name: filter
        in: query
        schema:
          type: string
          enum:
          - ALL
          - NEEDS_FEEDBACK
          - HAS_FEEDBACK
          - RETRACTED_FEEDBACK
          - PENDING_RESUBMISSION
          - UNAVAILABLE
          default: NEEDS_FEEDBACK
      - name: after
        in: query
        schema: *id001
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '400':
          description: Malformed/singleton query, limit, cursor or nonempty GET body
        '401':
          description: Secure singleton browser session required
        '403':
          description: Current registered Group OWNER required, even for empty results
        '404':
          description: Missing current Group participation or exact parent scope
        '503':
          description: Space authority unavailable
        '200':
          description: Submitted feedback and request metadata across all Studies
            in the exact Group/Space
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-brain_guest
  schemas:
    Row:
      type: object
      additionalProperties: false
      required:
      - submissionId
      - authorId
      - version
      - assignmentVersion
      - updatedAt
      - feedbackStatus
      - feedbackVersion
      - feedbackSubmissionVersion
      - retractionState
      - retractionVersion
      - assignmentId
      - assignmentTitle
      - assignmentState
      - studyId
      - studyTitle
      - studyState
      - needsFeedback
      - requestVersion
      - requestState
      - requestedSubmissionVersion
      properties:
        submissionId: *id001
        authorId: *id001
        version: &id002
          type: integer
          format: int64
          minimum: 1
        assignmentVersion: *id002
        updatedAt:
          type: string
          format: date-time
        feedbackStatus:
          type: string
          enum:
          - MISSING
          - CURRENT
          - OUTDATED
          - RETRACTED
          - UNAVAILABLE
        feedbackVersion: &id003
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        feedbackSubmissionVersion: *id003
        retractionState:
          type: string
          enum:
          - NONE
          - RETRACTED
          - RESTORED
          - UNKNOWN
        retractionVersion: *id003
        assignmentId:
          $ref: assignment-submissions.yaml#/components/schemas/Id
        assignmentTitle:
          type: string
          minLength: 1
          maxLength: 200
        assignmentState:
          type: string
          enum:
          - DRAFT
          - OPEN
          - CLOSED
          - RETIRED
        studyId:
          $ref: assignment-submissions.yaml#/components/schemas/Id
        studyTitle:
          type: string
          minLength: 1
          maxLength: 200
        needsFeedback:
          type: boolean
        requestVersion:
          type: &id004
          - integer
          - 'null'
          format: int64
          minimum: 1
        requestState:
          type: string
          enum:
          - NONE
          - REQUESTED
          - CANCELLED
          - RESOLVED
          - UNAVAILABLE
        requestedSubmissionVersion:
          type: *id004
          format: int64
          minimum: 1
        studyState:
          type: string
          enum:
          - PLANNED
          - ACTIVE
          - COMPLETED
          - RETIRED
    Page:
      type: object
      additionalProperties: false
      required:
      - items
      - nextAfter
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Row'
        nextAfter:
          anyOf:
          - *id001
          - type: 'null'
