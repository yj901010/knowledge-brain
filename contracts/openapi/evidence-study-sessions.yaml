openapi: 3.1.0
info:
  title: Private evidence to StudySession association
  version: 1.0.0
  description: Learning-owned optional relationship shared by typed NOTE/CONCEPT/MEDIA
    evidence. Existing evidence/session JSON, revisions, ETags and event v1 contracts
    remain unchanged. Link operations never change progress or study duration.
servers:
- url: https://localhost:8443
security:
- sessionCookie: []
paths:
  /api/spaces/{spaceId}/roadmaps/{roadmapId}/evidence/{evidenceId}/study-session:
    parameters: &id015
    - name: spaceId
      in: path
      required: true
      schema: &id001
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    - name: roadmapId
      in: path
      required: true
      schema: *id001
    - name: evidenceId
      in: path
      required: true
      schema: *id001
    get:
      operationId: readNoteEvidenceStudySession
      description: Fresh ROADMAP_READ. Known typed evidence including retired evidence/node/root.
        Default es0 reads and empty history never write. Returns only the original
        pinned association, without automatically fetching a current session. Wrong
        variant is 404. Empty body and no query.
      responses:
        '200': &id004
          description: Current independent link representation
          headers:
            Cache-Control: &id002
              schema:
                const: no-store
            ETag:
              schema:
                type: string
                pattern: ^"es(0|[1-9][0-9]*)"$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
        '400': &id005
          description: Invalid UUIDv7, strict body/query, paired fields, integer or
            strong esN ETag
          headers: &id003
            Cache-Control: *id002
        '401': &id006
          description: Common browser session unavailable
          headers: *id003
        '403': &id007
          description: Current private Space permission or browser origin denied
          headers: *id003
        '404': &id008
          description: Space, typed evidence, root/node or target session unavailable
            for the operation
          headers: *id003
        '409': &id009
          description: Current target session version changed or its learning node
            differs
          headers: *id003
        '412': &id010
          description: Independent evidence/session link ETag changed; explicitly
            inspect latest
          headers: *id003
        '413': &id011
          description: Body exceeds 4096 bytes
          headers: *id003
        '415': &id012
          description: JSON required
          headers: *id003
        '428': &id013
          description: If-Match required
          headers: *id003
        '503': &id014
          description: Space authorization or local persistence unavailable; no partial
            write
          headers: *id003
    put:
      operationId: setNoteEvidenceStudySession
      description: Fresh ROADMAP_WRITE, same-origin and strong esN required. Root
        lock serializes all Learning writes. A new/re-pinned target must be ACTIVE,
        same Space/Roadmap and same active learning node, with matching current sessionVersion.
        Unlink remains allowed for retired evidence/node/session while the root is
        active. All writes, including no-ops, reject retired roots. Exact same current
        link pin is a no-op after checking ETag, even if the source later changed/retired.
        Atomically commit independent relationship, full immutable revision and Protobuf
        Outbox. Missing/stale ETag is 428/412. A lost response must be resolved through
        explicit latest inspection, never blind overwrite.
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
          const: https://localhost:8443
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: ^"es(0|[1-9][0-9]*)"$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Input'
      responses:
        '200': *id004
        '400': *id005
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '412': *id010
        '413': *id011
        '415': *id012
        '428': *id013
        '503': *id014
  /api/spaces/{spaceId}/roadmaps/{roadmapId}/evidence/{evidenceId}/study-session/revisions:
    parameters: *id015
    get:
      operationId: readNoteEvidenceStudySessionHistory
      description: Fresh ROADMAP_READ; immutable full association history including
        after source/evidence/node/root retirement. No row means empty history. Strict
        descending version cursor; wrong-kind evidence is 404.
      parameters:
      - name: before
        in: query
        schema:
          type: integer
          format: int64
          minimum: 1
          default: 9223372036854775807
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
      responses:
        '200':
          description: Immutable association revisions
          headers: *id003
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: '#/components/schemas/Revision'
        '400': *id005
        '401': *id006
        '403': *id007
        '404': *id008
        '409': *id009
        '412': *id010
        '413': *id011
        '415': *id012
        '428': *id013
        '503': *id014
