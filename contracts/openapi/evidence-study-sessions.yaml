components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-brain_guest
  schemas:
    Link:
      type: object
      additionalProperties: false
      required:
      - linkId
      - evidenceId
      - evidenceKind
      - roadmapId
      - spaceId
      - nodeId
      - nodeTitle
      - visibility
      - state
      - version
      - sessionId
      - sessionVersion
      - sessionNodeTitle
      - startedAt
      - endedAt
      - durationSeconds
      - createdAt
      - updatedAt
      properties:
        linkId: &id034
          type:
          - string
          - 'null'
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        evidenceId: *id001
        evidenceKind:
          enum:
          - NOTE
          - CONCEPT
          - MEDIA
          - GITHUB
        roadmapId: *id001
        spaceId: *id001
        nodeId: *id001
        nodeTitle:
          type: string
          minLength: 1
          maxLength: 200
        visibility:
          const: PRIVATE
        state:
          enum:
          - LINKED
          - UNLINKED
        version:
          type: integer
          format: int64
          minimum: 0
        sessionId: *id034
        sessionVersion:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        sessionNodeTitle:
          type:
          - string
          - 'null'
          maxLength: 200
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        endedAt:
          type:
          - string
          - 'null'
          format: date-time
        durationSeconds:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 86400
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
      description: Version zero is UNLINKED with null linkId/timestamps and no database
        row. A persisted link keeps its UUIDv7 ID across unlink/relink. All session
        pin fields are null when UNLINKED; LINKED requires every session pin field.
        A later source edit/retirement never changes these historical pins.
    Input:
      type: object
      additionalProperties: false
      required:
      - sessionId
      - sessionVersion
      properties:
        sessionId: *id034
        sessionVersion:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
      description: Both fields must be null to unlink, or both must identify the selected
        current session/version. Body limit 4096 bytes; strict duplicate/unknown/trailing
        JSON and invalid integers rejected.
    Revision:
      type: object
      additionalProperties: false
      required:
      - revisionId
      - linkId
      - version
      - actorId
      - occurredAt
      - snapshot
      properties:
        revisionId: *id001
        linkId: *id001
        version:
          type: integer
          format: int64
          minimum: 1
        actorId: *id001
        occurredAt:
          type: string
          format: date-time
        snapshot:
          $ref: '#/components/schemas/Link'
