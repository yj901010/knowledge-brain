components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-brain_guest
  schemas:
    Id:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    StudyReference:
      type: object
      additionalProperties: false
      required:
      - studyId
      - studyVersion
      - title
      properties:
        studyId:
          $ref: '#/components/schemas/Id'
        studyVersion: *id013
        title: &id014
          type: string
          minLength: 1
          maxLength: 200
          description: Nonblank valid Unicode without controls, literal text
    Course:
      type: object
      additionalProperties: false
      required:
      - courseId
      - groupId
      - spaceId
      - creatorId
      - version
      - title
      - description
      - state
      - visibility
      - studies
      - createdAt
      - updatedAt
      properties:
        courseId:
          $ref: '#/components/schemas/Id'
        groupId:
          $ref: '#/components/schemas/Id'
        spaceId:
          $ref: '#/components/schemas/Id'
        creatorId:
          $ref: '#/components/schemas/Id'
        version: *id013
        title: *id014
        description: &id017
          type: string
          description: Valid Unicode/no NUL; UTF-8 <=32768 bytes
        state: &id016
          enum:
          - DRAFT
          - ACTIVE
          - COMPLETED
          - RETIRED
        visibility:
          const: PRIVATE
        studies:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/StudyReference'
          description: Ordered unique Study IDs, selection-time metadata/version;
            latest Study is read separately
        createdAt: &id015
          type: string
          format: date-time
        updatedAt: *id015
    Summary:
      type: object
      additionalProperties: false
      required:
      - courseId
      - version
      - title
      - state
      properties:
        courseId:
          $ref: '#/components/schemas/Id'
        version: *id013
        title: *id014
        state: *id016
    Input:
      type: object
      additionalProperties: false
      required:
      - title
      - description
      properties:
        title: *id014
        description: *id017
    StateInput:
      type: object
      additionalProperties: false
      required:
      - state
      properties:
        state:
          enum:
          - ACTIVE
          - COMPLETED
    CurriculumInput:
      type: object
      additionalProperties: false
      required:
      - studyIds
      properties:
        studyIds:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'
    Page:
      type: object
      additionalProperties: false
      required:
      - items
      - nextAfter
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Summary'
        nextAfter:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
    Revision:
      type: object
      additionalProperties: false
      required:
      - revisionId
      - version
      - actorId
      - occurredAt
      - snapshot
      properties:
        revisionId:
          $ref: '#/components/schemas/Id'
        version: *id013
        actorId:
          $ref: '#/components/schemas/Id'
        occurredAt: *id015
        snapshot:
          $ref: '#/components/schemas/Course'
    History:
      type: object
      additionalProperties: false
      required:
      - items
      - nextBefore
      properties:
        items:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Revision'
        nextBefore:
          oneOf:
          - *id013
          - type: 'null'
