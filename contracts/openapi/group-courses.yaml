openapi: 3.1.0
info:
  title: Group Courses and Ordered Study Curriculum
  version: 1.0.0
  description: Collaboration owns Course, ordered same-Group Study references and
    immutable full revisions. Space is the fresh current role authority; OWNER writes,
    MEMBER/VIEWER read. DRAFT -> ACTIVE -> COMPLETED, RETIRED irreversible. Curriculum
    editable only DRAFT, max50 unique nonarchived current same-Group/Space Study IDs.
    Selection pins Study version/title; later source changes never rewrite past Course
    snapshots. Start requires nonempty curriculum with nonarchived current sources,
    but changes no Study/personal progress. Group -> Course -> Study locks serialize
    edits/start/Study retirement. Metadata remains editable until retirement. Creation
    key is Group+creator scoped with immutable original title/description, returns
    current snapshot on exact retry after restart/edit/archive; changed intent409.
    Mutations require independent strong coN; no-op still requires current version.
    Current snapshot, local curriculum, immutable revision and Outbox atomic. PRIVATE
    Group-only; no personal progress/evidence/Note/Submission publication. Existing
    CDC emits collaboration.course.v1 with collaboration/course-events/1; deduplicate
    stable eventId and apply increasing aggregate versions. Catalog20/max100, full
    revision history3/max5 to fit bounded2MiB Gateway. No enrollment or per-person
    completion policy added.
security:
- browserSession: []
paths:
  /api/groups/{groupId}/courses:
    parameters:
    - &id011
      name: groupId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    get:
      operationId: listGroupCourses
      responses:
        '200':
          description: Fresh current Group-authorized Course result
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400': &id001
          description: Invalid exact input/UUIDv7/key/query/strong ETag
        '401': &id002
          description: Secure singleton browser session required
        '403': &id003
          description: Registered current role required, OWNER writes, same-origin
            HTTPS
        '404': &id004
          description: Group/Space/Course/Study unavailable or wrong parent
        '409': &id005
          description: Changed creation intent, archived source, fixed started curriculum,
            empty start or invalid lifecycle
        '412': &id006
          description: Stale Course version
        '413': &id007
          description: Body exceeds65536 bytes
        '415': &id008
          description: JSON required
        '428': &id009
          description: Course If-Match required
        '503': &id010
          description: Space authorization or Collaboration storage unavailable
      parameters:
      - name: after
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Id'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    post:
      operationId: createGroupCourse
      responses:
        '200':
          description: Fresh current Group-authorized Course result
          headers:
            Cache-Control:
              schema:
                const: no-store
            ETag:
              schema:
                type: string
                pattern: ^"co[1-9][0-9]*"$
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '412': *id006
        '413': *id007
        '415': *id008
        '428': *id009
        '503': *id010
        '201':
          description: Fresh current Group-authorized Course result
          headers:
            Cache-Control:
              schema:
                const: no-store
            ETag:
              schema:
                type: string
                pattern: ^"co[1-9][0-9]*"$
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{32}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Input'
  /api/groups/{groupId}/courses/{courseId}:
    parameters: &id012
    - *id011
    - name: courseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    get:
      operationId: getGroupCourse
      responses:
        '200':
          description: Fresh current Group-authorized Course result
          headers:
            Cache-Control:
              schema:
                const: no-store
            ETag:
              schema:
                type: string
                pattern: ^"co[1-9][0-9]*"$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '412': *id006
        '413': *id007
        '415': *id008
        '428': *id009
        '503': *id010
    put:
      operationId: reviseGroupCourse
      responses:
        '200':
          description: Fresh current Group-authorized Course result
          headers:
            Cache-Control:
              schema:
                const: no-store
            ETag:
              schema:
                type: string
                pattern: ^"co[1-9][0-9]*"$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '412': *id006
        '413': *id007
        '415': *id008
        '428': *id009
        '503': *id010
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        schema:
