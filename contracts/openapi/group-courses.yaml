      responses:
        '200':
          description: Fresh current Group-authorized Course result
          headers:
            Cache-Control:
              schema:
                const: no-store
            ETag:
              schema:
                type: string
                pattern: ^"co[1-9][0-9]*"$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '412': *id006
        '413': *id007
        '415': *id008
        '428': *id009
        '503': *id010
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: ^"co[1-9][0-9]*"$
  /api/groups/{groupId}/courses/{courseId}/curriculum:
    parameters: *id012
    put:
      operationId: replaceGroupCourseCurriculum
      responses:
        '200':
          description: Fresh current Group-authorized Course result
          headers:
