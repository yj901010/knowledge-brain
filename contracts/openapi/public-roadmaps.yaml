components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-brain_guest
  schemas:
    Id:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    Node:
      type: object
      additionalProperties: false
      required:
      - nodeId
      - title
      - description
      properties:
        nodeId:
          $ref: '#/components/schemas/Id'
        title: &id001
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          description: At most 2048 UTF-8 bytes.
    Edge:
      type: object
      additionalProperties: false
      required:
      - edgeId
      - kind
      - sourceNodeId
      - targetNodeId
      properties:
        edgeId:
          $ref: '#/components/schemas/Id'
        kind: &id011
          enum:
          - PREREQUISITE_OF
          - RECOMMENDED_BEFORE
          - PART_OF
          - REQUIRED_FOR
          - OPTIONAL_FOR
          - RELATED_TO
        sourceNodeId:
          $ref: '#/components/schemas/Id'
        targetNodeId:
          $ref: '#/components/schemas/Id'
    Graph:
      type: object
      additionalProperties: false
      required:
      - nodes
      - edges
      properties:
        nodes: &id003
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Node'
        edges: &id004
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/Edge'
    Summary:
      type: object
      additionalProperties: false
      required:
      - roadmapId
      - title
      - version
      - updatedAt
      properties:
        roadmapId:
          $ref: '#/components/schemas/Id'
        title: *id001
        version: *id002
        updatedAt:
          type: string
          format: date-time
    ProposalSummary:
      type: object
      additionalProperties: false
      required:
      - contributionId
      - roadmapId
      - baseVersion
      - authorId
      - state
      - version
      - title
      properties:
        contributionId: &id005
          $ref: '#/components/schemas/Id'
        roadmapId: &id006
          $ref: '#/components/schemas/Id'
        baseVersion: &id007
          type: integer
          format: int64
          minimum: 0
        authorId: &id008
          $ref: '#/components/schemas/Id'
        state: &id009
          enum:
          - SUBMITTED
          - APPROVED
          - REJECTED
          - MERGED
        version: *id002
        title: *id001
    Review:
      type: object
      additionalProperties: false
      required:
      - reviewId
      - contributionVersion
      - reviewerId
      - decision
      - reason
      - occurredAt
      properties:
        reviewId:
          $ref: '#/components/schemas/Id'
        contributionVersion: *id002
        reviewerId:
          $ref: '#/components/schemas/Id'
        decision:
          enum:
          - APPROVED
          - REJECTED
          - MERGED
        reason:
          type: string
          maxLength: 2000
        occurredAt:
          type: string
          format: date-time
    Roadmap:
      type: object
      additionalProperties: false
      required:
      - roadmapId
      - spaceId
      - visibility
      - verification
      - version
      - title
      - description
      - createdAt
      - updatedAt
      - nodes
      - edges
      properties:
        roadmapId:
          $ref: '#/components/schemas/Id'
        spaceId:
          $ref: '#/components/schemas/Id'
        visibility:
          const: PUBLIC
        verification:
          const: REVIEWED
        version: *id002
        title: *id001
        description: &id010
          type: string
          description: At most 32768 UTF-8 bytes; LF/CR/TAB allowed, other ISO controls/unpaired
            surrogates rejected.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        nodes: *id003
        edges: *id004
    Proposal:
      type: object
      additionalProperties: false
      required:
      - contributionId
      - roadmapId
      - baseVersion
      - authorId
      - state
      - version
      - title
      - spaceId
      - description
      - rationale
      - graph
      - createdAt
      - updatedAt
      - mergedRoadmapVersion
      properties:
        contributionId: *id005
        roadmapId: *id006
        baseVersion: *id007
        authorId: *id008
        state: *id009
        version: *id002
        title: *id001
        spaceId:
          $ref: '#/components/schemas/Id'
        description: *id010
        rationale:
          type: string
          minLength: 1
          maxLength: 2000
        graph:
          $ref: '#/components/schemas/Graph'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        mergedRoadmapVersion:
          type:
          - integer
          - 'null'
          minimum: 1
    Revision:
      type: object
      additionalProperties: false
      required:
      - revisionId
      - version
      - actorId
      - occurredAt
      - snapshot
      properties:
        revisionId:
          $ref: '#/components/schemas/Id'
        version: *id002
        actorId:
          $ref: '#/components/schemas/Id'
        occurredAt:
          type: string
          format: date-time
        snapshot:
          $ref: '#/components/schemas/Roadmap'
    RoadmapPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextAfter
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Summary'
        nextAfter:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
    ProposalPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextAfter
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ProposalSummary'
        nextAfter:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
    NodeEdit:
      type: object
      additionalProperties: false
      required:
      - key
      - title
      - description
      properties:
        key:
          type: string
          description: Existing ACTIVE public node UUIDv7 in base graph or new:[A-Za-z0-9_-]{1,32};
            CREATE only permits new keys.
        title: *id001
        description:
          type: string
          description: At most 2048 UTF-8 bytes.
    EdgeEdit:
      type: object
      additionalProperties: false
      required:
      - key
      - kind
      - source
      - target
      properties:
        key:
          type: string
          description: Existing public edge UUIDv7 in base graph or new draft key.
        kind: *id011
        source: &id012
          type: string
        target: *id012
    Submit:
      type: object
      additionalProperties: false
      required:
      - roadmapId
      - baseVersion
      - title
      - description
      - rationale
      - nodes
      - edges
      properties:
        roadmapId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        baseVersion: *id007
        title: *id001
        description: *id010
        rationale:
          type: string
          minLength: 1
          maxLength: 2000
        nodes:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/NodeEdit'
        edges:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/EdgeEdit'
