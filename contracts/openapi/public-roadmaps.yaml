openapi: 3.1.0
info:
  title: Public Roadmap Contribution and Review
  version: 1.0.0
  description: Explicit public graph snapshots; SUBMITTED -> APPROVED -> MERGED or
    REJECTED. New public canonical and proposal IDs. Reviewed verification separate
    from ranking/expert status. Private roadmap/progress/study/evidence are never
    copied. Bounded request 1 MiB, individual snapshot 512 KiB, review/merge 32 KiB.
    Original immutable payload bytes use separate learning.public-roadmap.v1 and learning.roadmap-contribution.v1.
    Every read uses a common guest or registered session and fresh Space authority;
    no public canonical PUT/DELETE. Strict JSON duplicate/unknown/trailing fields
    and GET bodies are rejected.
security:
- browserSession: []
paths:
  /api/public/spaces/{spaceId}/roadmaps:
    parameters:
    - name: spaceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    get:
      operationId: listPublicRoadmaps
      parameters:
      - name: after
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Id'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Authorized public snapshot; no personal learning data.
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapPage'
        '400':
          description: Strict JSON/query/graph/size invariant failed
          headers:
            Cache-Control:
              schema:
                const: no-store
        '401':
          description: Session required
          headers:
            Cache-Control:
              schema:
                const: no-store
        '403':
          description: Registration/reviewer/origin required, self-review forbidden
          headers:
            Cache-Control:
              schema:
                const: no-store
        '404':
          description: Public Space/roadmap/proposal unavailable
          headers:
            Cache-Control:
              schema:
                const: no-store
        '409':
          description: Illegal lifecycle transition
          headers:
            Cache-Control:
              schema:
                const: no-store
        '412':
          description: Stale contribution or public canonical base
          headers:
            Cache-Control:
              schema:
                const: no-store
        '413':
          description: Request exceeds bounded size
          headers:
            Cache-Control:
              schema:
                const: no-store
        '415':
          description: JSON required
          headers:
            Cache-Control:
              schema:
                const: no-store
        '428':
          description: Strong contribution If-Match required
          headers:
            Cache-Control:
              schema:
                const: no-store
        '503':
          description: Authority/database unavailable
          headers:
            Cache-Control:
              schema:
                const: no-store
