openapi: 3.1.0
info:
  title: Private Space Source API
  version: 1.1.0
  description: Knowledge owns immutable UUIDv7 Source metadata and independent revisions.
    All Sources are PRIVATE within an authorized PERSONAL Space. Existing CONCEPT_READ/CONCEPT_WRITE
    permissions serve the common guest/registered principal. Independent srcN ETags
    protect writes. Responses use Cache-Control no-store. URL and bibliographic/license
    notes are user metadata only. This API neither copies external datasets nor binds
    Sources to Claims, mutates Concept/Alias/Claim versions, publishes private data,
    or promotes verification. Retired Source history remains readable using its known
    authorized identity.
servers:
- url: https://localhost:8443
security:
- sessionCookie: []
paths:
  /api/spaces/{spaceId}/sources:
    parameters:
    - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: listPersonalSources
      description: List PRIVATE Sources in ascending immutable UUIDv7 order in the
        freshly authorized PERSONAL Space. Omitted state defaults to ACTIVE. Explicit
        RETIRED discovers retired metadata with the same response shape; existing
        history and Source citations remain available after retirement. after is exclusive.
        Only singleton after, limit and state are accepted. Duplicate metadata denotes
        independent Sources. No restore, publication, fetching or citation re-pinning.
      parameters:
      - name: after
        in: query
        schema:
          $ref: '#/components/schemas/UuidV7'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: state
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - RETIRED
          default: ACTIVE
      responses:
        '200':
          description: Authorized private Source page
          headers: &id006
            Cache-Control: &id001
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Unavailable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    post:
      operationId: createPersonalSource
      description: Create an ACTIVE PRIVATE Source at version 1. Strict application/json
        body, at most 32768 bytes, with exactly title, url, citation and licenseNote.
        Unknown/duplicate keys and trailing tokens are invalid. URL or nonblank citation
        is required. Metadata is not fetched, imported or verified. No duplicate metadata
        constraint or Source quota. Source, immutable revision and SourceCreated outbox
        event commit atomically.
      parameters:
      - &id002
        $ref: '#/components/parameters/Origin'
      requestBody: &id003
        $ref: '#/components/requestBodies/Edit'
      responses:
        '201':
          description: Created Source with independent strong ETag "src1"
          headers:
            ETag: &id005
              $ref: '#/components/headers/SourceETag'
            Cache-Control: *id001
            Location:
              description: Created Source canonical API path
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Unavailable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/spaces/{spaceId}/sources/{sourceId}:
    parameters:
    - $ref: '#/components/parameters/SpaceId'
    - $ref: '#/components/parameters/SourceId'
    get:
      operationId: getPersonalSource
      description: Read one ACTIVE PRIVATE Source in the authorized PERSONAL Space.
        Unknown, foreign, public or retired Sources return 404. No query parameters.
      responses:
        '200':
          $ref: '#/components/responses/Source'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Unavailable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    put:
      operationId: updatePersonalSource
      description: Replace title, URL, citation and license note of an ACTIVE PRIVATE
        Source using exactly one matching independent srcN ETag. Identity and Space
        remain immutable. Lock the Source row, validate the expected version, then
        atomically commit the Source, immutable snapshot and SourceUpdated outbox
        event. Strict JSON and text/URL rules match creation.
      parameters:
      - *id002
      - &id004
        $ref: '#/components/parameters/IfMatch'
      requestBody: *id003
      responses:
        '200':
          $ref: '#/components/responses/Source'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Unavailable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      operationId: retirePersonalSource
      description: Logically retire an ACTIVE PRIVATE Source using one exact independent
        srcN ETag. Preserve metadata, identity and history. Source retirement, immutable
        revision and SourceRetired outbox event commit atomically. No destructive
        deletion or Claim mutation. No query parameters.
      parameters:
      - *id002
      - *id004
      responses:
        '204':
          description: RETIRED Source with incremented independent version
          headers:
            ETag: *id005
            Cache-Control: *id001
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Unavailable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/spaces/{spaceId}/sources/{sourceId}/revisions:
    parameters:
    - $ref: '#/components/parameters/SpaceId'
    - $ref: '#/components/parameters/SourceId'
    get:
      operationId: listPersonalSourceRevisions
      description: Read immutable Source snapshots in descending Source version order
        in the authorized PERSONAL Space. Known Source history remains readable after
        Source retirement. before is an exclusive positive signed 64-bit cursor, default
        9223372036854775807. Only before and limit are accepted; repeated or unknown
        keys are invalid.
      parameters:
      - name: before
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
          default: 9223372036854775807
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
      responses:
        '200':
          description: Authorized retained Source revision history
          headers: *id006
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: '#/components/schemas/Revision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Unavailable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-brain_guest
      description: Secure HttpOnly host cookie for the common guest/registered session
        principal
  parameters:
    SpaceId:
      name: spaceId
      in: path
      required: true
      description: Owning PERSONAL PRIVATE Space with fresh authority checks
      schema:
        $ref: '#/components/schemas/UuidV7'
    SourceId:
      name: sourceId
      in: path
      required: true
      description: Immutable Source identity in the authorized PRIVATE PERSONAL Space
      schema:
        $ref: '#/components/schemas/UuidV7'
    Origin:
      name: Origin
      in: header
      required: true
      description: Exactly one configured browser origin; if present Sec-Fetch-Site
        must be same-origin
      schema:
        type: string
        example: https://localhost:8443
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: One independent strong Source ETag such as "src3"; weak, list,
        wildcard, other aggregate tags or signed 64-bit overflow are invalid
      schema:
        type: string
        pattern: ^"src[1-9][0-9]{0,18}"$
  headers:
    SourceETag:
      description: Independent strong Source version ETag, for example "src1"
      schema:
        type: string
        pattern: ^"src[1-9][0-9]{0,18}"$
    NoStore:
      schema:
        type: string
        const: no-store
  requestBodies:
    Edit:
      required: true
      description: Strict bounded JSON with exactly four keys; duplicate keys, trailing
        tokens and unknown fields are invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Edit'
  responses:
    BadRequest:
      description: Invalid canonical UUIDv7, bounded single-valued query, strict JSON,
        title/citation/licenseNote text, safe absolute HTTP(S) URL, or independent
        srcN ETag
      content: &id007
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, duplicate, expired or revoked session credential
      content: *id007
    Forbidden:
      description: TLS/origin/fetch-site/role denied
      content: *id007
    Unavailable:
      description: Authorized personal Space or Source unknown, foreign, public, inaccessible,
        or retired for an active read/write
      content: *id007
    Conflict:
      description: Source version cannot increment beyond 9223372036854775807; duplicate
        titles, URLs and citations are allowed
      content: *id007
    PreconditionFailed:
      description: Source version differs; reload the latest Source before saving
      content: *id007
    TooLarge:
      description: JSON request exceeds 32768 bytes
      content: *id007
    UnsupportedMediaType:
      description: application/json required
      content: *id007
    PreconditionRequired:
      description: If-Match is missing
      content: *id007
    BadGateway:
      description: Gateway cannot reach Knowledge
      content: *id007
    ServiceUnavailable:
      description: Persistence or Space/Identity authority unavailable; no partial
        mutation
      content: *id007
    GatewayTimeout:
      description: Gateway complete-response timeout
      content: *id007
    Source:
      description: Authorized ACTIVE PRIVATE Source with independent strong version
        ETag
      headers:
        ETag:
          $ref: '#/components/headers/SourceETag'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Source'
  schemas:
    UuidV7:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    Version:
      type: integer
      minimum: 1
      maximum: 9223372036854775807
    State:
      type: string
      enum:
      - ACTIVE
      - RETIRED
    Timestamp:
      type: string
      format: date-time
    Edit:
      type: object
      additionalProperties: false
      required:
      - title
      - url
      - citation
      - licenseNote
      properties:
        title:
          type: string
          pattern: ^[^\u0000]*$
          description: Java strip before requiring 1 through 200 Unicode code points.
            Unicode code point bounds; NUL and unpaired surrogates are invalid.
        url:
          type:
          - string
          - 'null'
          description: Nullable user-supplied reference metadata. Java strip removes
            outer whitespace; empty becomes null. A nonnull value must be ASCII, at
            most 2048 characters, absolute http or https, with a host, no userinfo,
            whitespace, control characters or backslash, and no port or a port from
            1 through 65535. Explicitly empty ports are invalid. Authority must not
            contain percent signs; encoded hosts and IPv6 scope/zone identifiers are
            rejected. Fragments are allowed. No automatic fetching, URL canonicalization
            or content import.
        citation: &id008
          type: string
          maxLength: 4000
          pattern: ^[^\u0000]*$
          description: Bibliographic text preserved exactly, including newlines/outer
            whitespace. Nonblank Java-stripped citation is required when URL is null.
            Unicode code point bounds; NUL and unpaired surrogates are invalid.
        licenseNote: &id009
          type: string
          maxLength: 1000
          pattern: ^[^\u0000]*$
          description: User-supplied rights/provenance note preserved exactly. Empty
            allowed. This is not an assertion of a dataset license or redistribution
            rights. Unicode code point bounds; NUL and unpaired surrogates are invalid.
      description: 'Strict JSON at most 32768 bytes with exactly these four keys.
        URL may be null; strings must be valid Unicode. At least a nonnull URL or
        a nonblank Java-stripped citation must remain after normalization. Duplicate
        metadata is allowed. Example offline reference: title=''Distributed Systems'',
        url=null, citation=''Author, publisher, year'', licenseNote=''Personal bibliographic
        reference''.'
    Source:
      type: object
      additionalProperties: false
      required:
      - sourceId
      - spaceId
      - title
      - url
      - citation
      - licenseNote
      - visibility
      - state
      - version
      - createdAt
      - updatedAt
      properties:
        sourceId:
          $ref: '#/components/schemas/UuidV7'
        spaceId:
          $ref: '#/components/schemas/UuidV7'
        title: &id010
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[^\u0000]*$
          description: Canonical Java-stripped title. Unicode code point bounds; NUL
            and unpaired surrogates are invalid.
        url: &id011
          anyOf:
          - type: string
            minLength: 1
            maxLength: 2048
          - type: 'null'
          description: Nullable user-supplied reference metadata. Java strip removes
            outer whitespace; empty becomes null. A nonnull value must be ASCII, at
            most 2048 characters, absolute http or https, with a host, no userinfo,
            whitespace, control characters or backslash, and no port or a port from
            1 through 65535. Explicitly empty ports are invalid. Authority must not
            contain percent signs; encoded hosts and IPv6 scope/zone identifiers are
            rejected. Fragments are allowed. No automatic fetching, URL canonicalization
            or content import.
        citation: *id008
        licenseNote: *id009
        visibility:
          type: string
          const: PRIVATE
        state:
          $ref: '#/components/schemas/State'
        version:
          $ref: '#/components/schemas/Version'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    Revision:
      type: object
      additionalProperties: false
      required:
      - revisionId
      - sourceId
      - title
      - url
      - citation
      - licenseNote
      - version
      - state
      - actorId
      - occurredAt
      properties:
        revisionId:
          $ref: '#/components/schemas/UuidV7'
        sourceId:
          $ref: '#/components/schemas/UuidV7'
        title: *id010
        url: *id011
        citation: *id008
        licenseNote: *id009
        version:
          $ref: '#/components/schemas/Version'
        state:
          $ref: '#/components/schemas/State'
        actorId:
          $ref: '#/components/schemas/UuidV7'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
    Page:
      type: object
      additionalProperties: false
      required:
      - items
      - nextAfter
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Source'
        nextAfter:
          description: Last returned Source UUIDv7 when another active page exists,
            otherwise null
          anyOf:
          - $ref: '#/components/schemas/UuidV7'
          - type: 'null'
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
