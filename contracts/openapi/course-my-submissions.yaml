openapi: 3.1.0
info:
  title: Course own submissions and grading metadata
  version: 1.0.0
  description: Fresh current registered Group participant including VIEWER reads only
    own submitted work through current canonical Course curriculum. Independent of
    enrollment/private progress. Fifteen metadata fields add current Study ID/title
    and Course state to existing exact latest grade-version semantics. ALL default;
    MISSING/CURRENT/OUTDATED/RETRACTED/UNAVAILABLE/NEEDS_GRADING retain Study meanings.
    Direct/rubric0 count as grades; current metadata is never pass/completion. Historical
    annotations never invalidate newer grades, resubmission never inherits an older-answer
    grade, unknown marker fails closed. No unsubmitted/peer/roster rows, score, reason,
    answer or file contents. Original fresh curriculum/source navigation supplies
    details and current write permissions. Archived parents retain reads. One local
    Collaboration statement, full Group/Space/Course/Study/Assignment/actor scope,
    filter before ascending Submission UUIDv7 keyset limit+1/default20/max100. No
    mutation, enrollment, migration/event contract/dependency, cross-owner SQL, notification
    or progress sharing. Existing endpoints unchanged.
servers:
- url: https://localhost:8443
security:
- browserSession: []
paths:
  /api/groups/{groupId}/courses/{courseId}/my-submissions:
    parameters:
    - name: groupId
      in: path
      required: true
      schema: &id001
        $ref: assignment-submissions.yaml#/components/schemas/Id
    - name: courseId
      in: path
      required: true
      schema: *id001
    get:
      operationId: getCourseOwnSubmissions
      parameters:
      - name: filter
        in: query
        schema:
          type: string
          enum:
          - NEEDS_GRADING
          - ALL
          - MISSING
          - CURRENT
          - OUTDATED
          - RETRACTED
          - UNAVAILABLE
          default: ALL
      - name: after
        in: query
        schema: *id001
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '400':
          description: Malformed/singleton query, limit, cursor or nonempty GET body
        '401':
          description: Secure singleton browser session required
        '403':
          description: Registered Group participation required
        '404':
          description: Missing current Group participation or exact parent scope
        '503':
          description: Space authority unavailable
        '200':
          description: Own submitted work only in current curriculum, with current
            Study labels and content-free grade metadata
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-brain_guest
  schemas:
    Row:
      type: object
      additionalProperties: false
      required:
      - submissionId
      - assignmentId
      - assignmentTitle
      - assignmentState
      - version
      - assignmentVersion
      - updatedAt
      - gradingStatus
      - gradeVersion
      - gradedSubmissionVersion
      - gradeRetractionState
      - retractionVersion
      - studyId
      - studyTitle
      - courseState
      properties:
        submissionId: *id001
        version: &id002
          type: integer
          format: int64
          minimum: 1
        assignmentVersion: *id002
        updatedAt:
          type: string
          format: date-time
        gradingStatus:
          type: string
          enum:
          - MISSING
          - CURRENT
          - OUTDATED
          - RETRACTED
          - UNAVAILABLE
        gradeVersion: &id003
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        gradedSubmissionVersion: *id003
        gradeRetractionState:
          type: string
          enum:
          - NONE
          - RETRACTED
          - RESTORED
          - UNKNOWN
        retractionVersion: *id003
        assignmentId:
          $ref: assignment-submissions.yaml#/components/schemas/Id
        assignmentTitle:
          type: string
          minLength: 1
          maxLength: 200
        assignmentState:
          type: string
          enum:
          - DRAFT
          - OPEN
          - CLOSED
          - RETIRED
        studyId:
          $ref: assignment-submissions.yaml#/components/schemas/Id
        studyTitle:
          type: string
          minLength: 1
          maxLength: 200
        courseState:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - COMPLETED
          - RETIRED
    Page:
      type: object
      additionalProperties: false
      required:
      - items
      - nextAfter
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Row'
        nextAfter:
          anyOf:
          - *id001
          - type: 'null'
