openapi: 3.1.0
info:
  title: Credential-isolated opaque Media consumer files
  version: 1.0.0
  description: Internal HTTPS only. Dedicated Collaboration bearer credential and
    NetworkPolicy; never Gateway routable. Context/owner are opaque IDs, no Group/Assignment
    semantics. The consumer checks current Space authority before every operation.
    No credentials in logs. Exact duplicate/trailing-free JSON <=4096 bytes, valid
    singleton traceparent, no query; response no-store.
security:
- serviceCredential: []
paths:
  /internal/media/domain-files/create:
    post:
      operationId: scopedMediaCreate
      description: Dedicated consumer scope match; no personal Media fallback.
      parameters: []
      responses:
        '400':
          description: Strict fields, input or path invalid
        '401':
          description: Missing session
        '403':
          description: Role or same-origin denied
        '404':
          description: Unavailable scope, attempt or file; privacy non-disclosure
        '409':
          description: Lifecycle/Media state or changed intent conflict
        '412':
          description: Stale submission/instructions
        '413':
          description: Bounded request exceeded
        '415':
          description: JSON required
        '428':
          description: If-Match required
        '503':
          description: Authority/Media unavailable; no automatic retry
        '200':
          description: Authorized no-store response
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Created'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommand'
  /internal/media/domain-files/get:
    post:
      operationId: scopedMediaGet
      description: Dedicated consumer scope match; no personal Media fallback.
      parameters: []
      responses:
