syntax = "proto3";
package knowledgebrain.content.links.v1;
option java_package = "io.knowledgebrain.contracts.content.links.v1";
option java_multiple_files = true;
message LinkEventEnvelopeV1 {
 string event_id = 1; string event_type = 2; uint32 event_version = 3;
 int64 occurred_at_epoch_millis = 4; string producer = 5; string aggregate_type = 6;
 string aggregate_id = 7; string space_id = 8; string actor_id = 9; string trace_id = 10; bytes payload = 11;
}
message WikiLinkV1 {
 string link_id = 1; uint32 ordinal = 2; uint32 start_offset = 3; uint32 end_offset = 4;
 string target_token = 5; string target_note_id = 6; string status = 7;
 string label = 8; string fragment = 9; string requested_target_id = 10;
}
// Complete outgoing snapshot. Durable event_id deduplication and monotonically
// increasing link_version are required; note_version alone does not order resolution.
message NoteLinksChangedPayloadV1 {
 string source_note_id = 1; uint64 note_version = 2; uint64 link_version = 3;
 string source_state = 4; repeated WikiLinkV1 links = 5; string revision_id = 6;
}
