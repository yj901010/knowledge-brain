syntax = "proto3";
package knowledgebrain.content.v1;
option java_package = "io.knowledgebrain.contracts.content.v1";
option java_multiple_files = true;
message EventEnvelopeV1 {
  string event_id = 1;
  string event_type = 2;
  uint32 event_version = 3;
  int64 occurred_at_epoch_millis = 4;
  string producer = 5;
  string aggregate_type = 6;
  string aggregate_id = 7;
  string space_id = 8;
  string actor_id = 9;
  string trace_id = 10;
  bytes payload = 11;
}
// Full revision snapshot; consumers deduplicate event_id and order by note version.
// PRIVATE payloads require restricted topic ACLs and permission-filtered projections.
message NoteChangedPayloadV1 {
  string note_id = 1;
  string revision_id = 2;
  uint64 version = 3;
  string state = 4;
  string visibility = 5;
  string title = 6;
  string markdown = 7;
}
