syntax="proto3";
package knowledgebrain.collaboration.group.v1;
option java_package="io.knowledgebrain.contracts.collaboration.group.v1";
option java_multiple_files=true;
// Immutable v1 envelope. Group creation has no Space until Space provisions it.
message EventEnvelopeV1 {
 string event_id=1; string event_type=2; uint32 event_version=3;
 int64 occurred_at_epoch_millis=4; string producer=5; string aggregate_type=6;
 string aggregate_id=7; optional string space_id=8; optional string actor_id=9;
 string trace_id=10; bytes payload=11;
}
message GroupSnapshotV1 {
 string group_id=1; optional string space_id=2; string creator_principal_id=3;
 string title=4; string description=5; string state=6; uint64 version=7;
 string visibility=8;
}
