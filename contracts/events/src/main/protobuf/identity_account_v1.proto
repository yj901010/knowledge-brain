syntax = "proto3";
package knowledgebrain.identity.account.v1;
option java_package = "io.knowledgebrain.contracts.identity.account.v1";
option java_multiple_files = true;
message EventEnvelopeV1 {
  string event_id = 1;
  string event_type = 2;
  uint32 event_version = 3;
  int64 occurred_at_epoch_millis = 4;
  string producer = 5;
  string aggregate_type = 6;
  string aggregate_id = 7;
  optional string space_id = 8;
  optional string actor_id = 9;
  string trace_id = 10;
  bytes payload = 11;
}
message GuestSpaceClaimRequestedPayloadV1 {
  string guest_principal_id = 1;
  string registered_principal_id = 2;
}
