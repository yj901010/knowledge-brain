syntax = "proto3";
package content.bookmark.v1;
option java_package = "io.knowledgebrain.contracts.content.bookmark.v1";
option java_multiple_files = true;
message BookmarkEventEnvelopeV1 {
 string event_id=1; string event_type=2; uint32 event_version=3; int64 occurred_at_epoch_millis=4;
 string producer=5; string aggregate_type=6; string aggregate_id=7; string space_id=8;
 string actor_id=9; string trace_id=10; bytes payload=11;
}
// Complete private Content-owned revision; URL is user-entered and never fetched.
message BookmarkChangedPayloadV1 {
 string bookmark_id=1; string revision_id=2; uint64 version=3; string visibility=4; string state=5;
 string title=6; string url=7; string memo=8; string created_at=9; string updated_at=10;
}
