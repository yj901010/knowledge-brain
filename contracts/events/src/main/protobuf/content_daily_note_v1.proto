syntax = "proto3";
package knowledgebrain.content.daily.v1;
option java_package = "io.knowledgebrain.contracts.content.daily.v1";
option java_multiple_files = true;
message DailyEventEnvelopeV1 {
 string event_id=1;string event_type=2;uint32 event_version=3;
 int64 occurred_at_epoch_millis=4;string producer=5;string aggregate_type=6;
 string aggregate_id=7;string space_id=8;string actor_id=9;string trace_id=10;bytes payload=11;
}
message DailyNoteChangedPayloadV1 {
 string note_id=1;string journal_date=2;string timezone=3;
 uint64 note_version=4;string note_state=5;string title=6;string visibility=7;
}
