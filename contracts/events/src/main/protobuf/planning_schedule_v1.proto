syntax = "proto3";
package planning.schedule.v1;
option java_package = "io.knowledgebrain.contracts.planning.schedule.v1";
option java_multiple_files = true;
message ScheduleEventEnvelopeV1 {
 string event_id=1;string event_type=2;uint32 event_version=3;int64 occurred_at_epoch_millis=4;
 string producer=5;string aggregate_type=6;string aggregate_id=7;string space_id=8;
 string actor_id=9;string trace_id=10;bytes payload=11;
}
// Complete private one-time interval. UTC instants are canonical; local/offset labels
// are pinned at mutation time. Empty task_id means no link. No automatic Task changes.
message ScheduleChangedPayloadV1 {
 string schedule_id=1;string revision_id=2;uint64 version=3;string visibility=4;string state=5;
 string title=6;string description=7;string starts_at=8;string ends_at=9;string time_zone=10;string task_id=11;
 string created_at=12;string updated_at=13;string starts_local=14;string ends_local=15;string starts_offset=16;string ends_offset=17;
}
