syntax = "proto3";
package knowledgebrain.space.claim.v1;
option java_package = "io.knowledgebrain.contracts.space.claim.v1";
option java_multiple_files = true;
message EventEnvelopeV1 {
 string event_id = 1;
 string event_type = 2;
 uint32 event_version = 3;
 int64 occurred_at_epoch_millis = 4;
 string producer = 5;
 string aggregate_type = 6;
 string aggregate_id = 7;
 optional string space_id = 8;
 optional string actor_id = 9;
 string trace_id = 10;
 bytes payload = 11;
}
message PersonalSpaceClaimedPayloadV1 {
 string space_id = 1;
 string guest_principal_id = 2;
 string owner_principal_id = 3;
}
