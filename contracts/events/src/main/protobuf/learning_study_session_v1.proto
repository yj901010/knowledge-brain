syntax = "proto3";
package knowledgebrain.learning.session.v1;
option java_package = "io.knowledgebrain.contracts.learning.session.v1";
option java_multiple_files = true;
message StudySessionEventEnvelopeV1 {
 string event_id = 1;
 string event_type = 2;
 uint32 event_version = 3;
 int64 occurred_at_epoch_millis = 4;
 string producer = 5;
 string aggregate_type = 6;
 string aggregate_id = 7;
 string space_id = 8;
 string actor_id = 9;
 string trace_id = 10;
 bytes payload = 11;
}
// A complete immutable private time-log revision, retained after retirement.
message StudySessionChangedPayloadV1 {
 string session_id = 1;
 string revision_id = 2;
 string roadmap_id = 3;
 string node_id = 4;
 string node_title = 5;
 uint64 version = 6;
 string state = 7;
 string visibility = 8;
 string started_at = 9;
 string ended_at = 10;
 uint64 duration_seconds = 11;
 string note = 12;
 string created_at = 13;
 string updated_at = 14;
}
