syntax = "proto3";
package knowledgebrain.knowledge.source.v1;
option java_package = "io.knowledgebrain.contracts.knowledge.source.v1";
option java_multiple_files = true;

// Independently published as knowledge/source-events version 1.
// Existing Concept, Alias and Claim event versions remain immutable.
message EventEnvelopeV1 {
  string event_id = 1;
  string event_type = 2;
  uint32 event_version = 3;
  int64 occurred_at_epoch_millis = 4;
  string producer = 5;
  string aggregate_type = 6;
  string aggregate_id = 7;
  string space_id = 8;
  string actor_id = 9;
  string trace_id = 10;
  bytes payload = 11;
}

// Complete PRIVATE Source metadata revision snapshot.
// An empty URL represents the canonical nullable URL; citation preserves raw text.
// License notes are user metadata, not a rights or verification attestation.
// Consumers deduplicate event_id and order snapshots by source_id/version.
// These events neither bind Sources to Claims nor change Claim verification.
message SourceChangedPayloadV1 {
  string source_id = 1;
  string title = 2;
  string url = 3;
  string citation = 4;
  string license_note = 5;
  string revision_id = 6;
  uint64 version = 7;
  string state = 8;
  string visibility = 9;
}
