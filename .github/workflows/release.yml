name: Build scanned release
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact 40-character source commit on the default branch
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ghcr-release
  cancel-in-progress: false
jobs:
  source:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false
      - run: python scripts/ci/delivery.py release-source --revision "$SOURCE_REVISION" --branch "$DEFAULT_BRANCH"
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - id: matrix
        run: echo "value=$(python scripts/ci/delivery.py matrix)" >> "$GITHUB_OUTPUT"
  validate:
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ inputs.source_revision }}
  images:
    needs: [source, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ghcr-release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    env:
      CI_MAVEN_IMAGE: maven:3.10.0-eclipse-temurin-25@sha256:0396dcd8cd0d46a0d2026449b714b2a5bbe53cce030975b5a41f8ffa3f5f0525
      SOURCE_REVISION: ${{ inputs.source_revision }}
      REPOSITORY: ${{ github.repository }}
      SERVICE: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - if: matrix.name == 'gateway-service'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-web
          path: .local/download-web
      - if: matrix.name == 'gateway-service'
        run: python scripts/ci/delivery.py restore-web --directory .local/download-web --revision "$SOURCE_REVISION"
      - run: python scripts/ci/bootstrap.py trivy
      - run: python scripts/ci/delivery.py build-image --service "$SERVICE" --repository "${REPOSITORY,,}" --revision "$SOURCE_REVISION"
      - run: python scripts/ci/delivery.py publish --service "$SERVICE" --repository "${REPOSITORY,,}" --revision "$SOURCE_REVISION"
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.name }}
          path: |
            services/${{ matrix.name }}/target/image.json
            services/${{ matrix.name }}/target/trivy.json
            services/${{ matrix.name }}/target/scan-proof.json
          if-no-files-found: error
          retention-days: 14
  release:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: .local/images
      - run: python scripts/ci/delivery.py assemble --directory .local/images --repository "${REPOSITORY,,}" --revision "$SOURCE_REVISION"
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-lock
          path: .local/release-lock.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
