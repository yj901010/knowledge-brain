{{- range $role, $pool := dict "controller" .Values.controllers "broker" .Values.brokers }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: {{ $role }}s
  namespace: {{ $.Release.Namespace }}
  labels:
    strimzi.io/cluster: {{ $.Values.clusterName }}
spec:
  replicas: {{ $pool.replicas }}
  roles: [{{ $role }}]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ $pool.storage }}
        deleteClaim: false
{{- if $.Values.storageClass }}
        class: {{ $.Values.storageClass | quote }}
{{- end }}
  jvmOptions:
    "-Xms": {{ $pool.heap | quote }}
    "-Xmx": {{ $pool.heap | quote }}
  resources:
{{ toYaml $pool.resources | indent 4 }}
{{- end }}
