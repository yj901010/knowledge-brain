apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: brain-minio-data}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.storageSize }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: brain-minio}
spec:
  replicas: {{ .Values.replicas }}
  strategy: {type: Recreate}
  selector: {matchLabels: {app: brain-minio}}
  template:
    metadata: {labels: {app: brain-minio}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
      - name: minio
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        ports: [{name: s3, containerPort: 9000}]
        env:
        - name: MINIO_ROOT_USER
          valueFrom: {secretKeyRef: {name: brain-minio-root, key: accessKey}}
        - name: MINIO_ROOT_PASSWORD
          valueFrom: {secretKeyRef: {name: brain-minio-root, key: secretKey}}
        - {name: MINIO_API_CORS_ALLOW_ORIGIN, value: 'https://localhost:8443'}
        - {name: MINIO_BROWSER, value: 'off'}
        resources:
{{ toYaml .Values.resources | indent 10 }}
        startupProbe: {httpGet: {scheme: HTTPS, path: /minio/health/live, port: s3}, periodSeconds: 5, failureThreshold: 30}
        livenessProbe: {httpGet: {scheme: HTTPS, path: /minio/health/live, port: s3}, periodSeconds: 10}
        readinessProbe: {httpGet: {scheme: HTTPS, path: /minio/health/ready, port: s3}, periodSeconds: 5}
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: temporary, mountPath: /tmp}
        - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
      - {name: data, persistentVolumeClaim: {claimName: brain-minio-data}}
      - {name: temporary, emptyDir: {sizeLimit: 64Mi}}
      - name: tls
        secret:
          secretName: brain-minio-tls
          items: [{key: tls.crt, path: public.crt}, {key: tls.key, path: private.key}]
---
apiVersion: v1
kind: Service
metadata: {name: brain-minio}
spec:
  selector: {app: brain-minio}
  ports: [{name: s3, port: 9000, targetPort: s3}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: brain-minio-private}
spec:
  podSelector: {matchLabels: {app: brain-minio}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: brain-apps}}
      podSelector: {matchLabels: {app.kubernetes.io/name: media-service}}
    - podSelector: {matchLabels: {brain-guest-api-validation: 'true'}}
    - podSelector: {matchLabels: {media-storage-client: 'true'}}
    - podSelector: {matchLabels: {media-storage-operator: 'true'}}
    ports: [{protocol: TCP, port: 9000}]
