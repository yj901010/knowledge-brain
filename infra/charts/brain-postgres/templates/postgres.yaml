apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.image | quote }}
          # Start as root for volume ownership; official entrypoint drops to postgres.
          securityContext:
            allowPrivilegeEscalation: false
          args:
            - postgres
            - -c
            - wal_level=logical
            - -c
            - max_replication_slots=32
            - -c
            - max_wal_senders=32
            - -c
            - max_connections=200
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD_FILE
              value: /run/admin/password
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=scram-sha-256"
          ports:
            - name: postgres
              containerPort: 5432
          resources:
{{ toYaml .Values.resources | indent 12 }}
          startupProbe:
            exec:
              command: [pg_isready, -h, "127.0.0.1", -U, postgres, -d, postgres]
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            periodSeconds: 5
          readinessProbe:
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            exec:
              command: [pg_isready, -h, "127.0.0.1", -U, postgres, -d, postgres]
            periodSeconds: 5
          livenessProbe:
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            exec:
              command: [pg_isready, -h, "127.0.0.1", -U, postgres, -d, postgres]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: admin
              mountPath: /run/admin
              readOnly: true
            - name: owner-secrets
              mountPath: /run/brain-db-secrets
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: {{ .Release.Name }}-scripts
            items:
              - key: initialize.sh
                path: initialize.sh
        - name: admin
          secret:
            secretName: {{ .Values.adminSecret }}
        - name: owner-secrets
          projected:
            defaultMode: 0444
            sources:
            {{- range $owner, $secret := .Values.owners }}
              - secret:
                  name: {{ $secret }}
                  items:
                    - key: password
                      path: {{ $owner }}/password
            {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storage.className }}
        storageClassName: {{ .Values.storage.className }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
