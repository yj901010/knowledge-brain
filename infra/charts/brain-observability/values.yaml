components:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    args: [--config=/config/collector.yaml]
    uid: 10001
    storage: 1Gi
    dataPath: /data
    ports: [{name: otlp-http, containerPort: 4318}, {name: metrics, containerPort: 8889}, {name: health, containerPort: 13133}]
    probe: {httpGet: {path: /, port: health}}
    resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 384Mi}}
    mounts: [{name: server-tls, mountPath: /tls, readOnly: true}]
    volumes: [{name: server-tls, secret: {secretName: brain-otel-server-tls}}]
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    args: [--config.file=/config/prometheus.yaml, --storage.tsdb.path=/data, --storage.tsdb.retention.time=24h, --storage.tsdb.retention.size=768MB, --web.listen-address=0.0.0.0:9090]
    uid: 65534
    storage: 1Gi
    dataPath: /data
    ports: [{name: http, containerPort: 9090}]
    probe: {httpGet: {path: /-/ready, port: http}}
    resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
  alertmanager:
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    args: [--config.file=/config/alertmanager.yaml, --storage.path=/data, --web.listen-address=0.0.0.0:9093, --cluster.listen-address=]
    uid: 65534
    storage: 256Mi
    dataPath: /data
    ports: [{name: http, containerPort: 9093}]
    probe: {httpGet: {path: /-/ready, port: http}}
    resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 250m, memory: 128Mi}}
  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    args: [-config.file=/config/loki.yaml]
    uid: 10001
    storage: 2Gi
    dataPath: /data
    ports: [{name: http, containerPort: 3100}]
    probe: {httpGet: {path: /ready, port: http}}
    resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 384Mi}}
  tempo:
    image: grafana/tempo:2.10.10@sha256:12b0820f13ffa10ce956b6e9acc3b03f3cffded99109be6cc09d106fe56e5d38
    args: [-config.file=/config/tempo.yaml]
    uid: 10001
    storage: 2Gi
    dataPath: /data
    ports: [{name: http, containerPort: 3200}, {name: otlp-http, containerPort: 4318}]
    probe: {httpGet: {path: /ready, port: http}}
    resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 384Mi}}
  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    uid: 472
    storage: 1Gi
    dataPath: /var/lib/grafana
    ports: [{name: https, containerPort: 3000}]
    probe: {httpGet: {path: /api/health, port: https, scheme: HTTPS}}
    resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 384Mi}}
    env: [{name: GF_PATHS_CONFIG, value: /config/grafana.ini}, {name: GF_PLUGINS_PREINSTALL_DISABLED, value: 'true'}]
    mounts:
      - {name: grafana-tls, mountPath: /tls, readOnly: true}
      - {name: credentials, mountPath: /credentials, readOnly: true}
      - {name: config, mountPath: /etc/grafana/provisioning/datasources/brain.yaml, subPath: datasources.yaml, readOnly: true}
      - {name: config, mountPath: /etc/grafana/provisioning/dashboards/brain.yaml, subPath: dashboards.yaml, readOnly: true}
      - {name: config, mountPath: /etc/grafana/brain-dashboards/platform.json, subPath: platform.json, readOnly: true}
    volumes:
      - {name: grafana-tls, secret: {secretName: brain-grafana-tls}}
      - {name: credentials, secret: {secretName: brain-grafana-admin}}
  platform-observer:
    image: python:3.13.7-alpine@sha256:9ba6d8cbebf0fb6546ae71f2a1c14f6ffd2fdab83af7fa5669734ef30ad48844
    command: [python, -u, /config/observer.py]
    uid: 10001
    serviceAccount: brain-observability-observer
    ports: [{name: http, containerPort: 9102}]
    probe: {httpGet: {path: /healthz, port: http}}
    resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 250m, memory: 96Mi}}
