target: all
server: {http_listen_port: 3200}
distributor:
  receivers:
    otlp:
      protocols:
        http: {endpoint: '0.0.0.0:4318'}
ingester: {max_block_duration: 5m, max_block_bytes: 50000000}
compactor: {compaction: {block_retention: 6h}}
storage:
  trace:
    backend: local
    wal: {path: /data/wal}
    local: {path: /data/blocks}
usage_report: {reporting_enabled: false}
