auth_enabled: false
server: {http_listen_port: 3100}
common:
  instance_addr: 127.0.0.1
  path_prefix: /data
  replication_factor: 1
  ring: {kvstore: {store: inmemory}}
  storage: {filesystem: {chunks_directory: /data/chunks, rules_directory: /data/rules}}
schema_config:
  configs:
  - from: '2026-01-01'
    store: tsdb
    object_store: filesystem
    schema: v13
    index: {prefix: brain_index_, period: 24h}
storage_config: {tsdb_shipper: {active_index_directory: /data/index, cache_location: /data/cache}}
compactor: {working_directory: /data/compactor, retention_enabled: true, delete_request_store: filesystem}
limits_config:
  retention_period: 24h
  allow_structured_metadata: true
  ingestion_rate_mb: 1
  ingestion_burst_size_mb: 2
  max_global_streams_per_user: 500
  query_timeout: 30s
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config: [{action: index_label, attributes: [service.name, service.namespace]}]
analytics: {reporting_enabled: false}
