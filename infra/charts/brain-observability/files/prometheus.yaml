global: {scrape_interval: 10s, evaluation_interval: 10s}
rule_files: [/config/alerts.yaml]
alerting:
  alertmanagers:
  - static_configs: [{targets: ['brain-alertmanager:9093']}]
scrape_configs:
- job_name: platform
  static_configs: [{targets: ['brain-platform-observer:9102']}]
- job_name: applications
  static_configs: [{targets: ['brain-otel-collector:8889']}]
- job_name: kafka
  static_configs: [{targets: ['brain-kafka-kafka-exporter.brain-events.svc:9404']}]
- job_name: prometheus
  static_configs: [{targets: ['127.0.0.1:9090']}]
- job_name: loki
  static_configs: [{targets: ['brain-loki:3100']}]
- job_name: tempo
  static_configs: [{targets: ['brain-tempo:3200']}]
