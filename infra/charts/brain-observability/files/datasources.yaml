apiVersion: 1
datasources:
- {name: Prometheus, uid: brain-prometheus, type: prometheus, access: proxy, url: 'http://brain-prometheus:9090', isDefault: true, editable: false, jsonData: {timeInterval: 10s, httpMethod: POST, manageAlerts: true}}
- name: Loki
  uid: brain-loki
  type: loki
  access: proxy
  url: http://brain-loki:3100
  editable: false
  jsonData:
    derivedFields:
    - {name: TraceID, matcherType: label, matcherRegex: trace_id, datasourceUid: brain-tempo, url: '$${__value.raw}'}
    - {name: DomainTraceID, matcherType: label, matcherRegex: domain_trace_id, datasourceUid: brain-tempo, url: '$${__value.raw}'}
- name: Tempo
  uid: brain-tempo
  type: tempo
  access: proxy
  url: http://brain-tempo:3200
  editable: false
  jsonData:
    nodeGraph: {enabled: true}
    tracesToLogsV2:
      datasourceUid: brain-loki
      filterByTraceID: false
      filterBySpanID: false
      customQuery: true
      query: '{service_name=~".+"} | trace_id = "$${__span.traceId}" or domain_trace_id = "$${__span.traceId}"'
- {name: Alertmanager, uid: brain-alertmanager, type: alertmanager, access: proxy, url: 'http://brain-alertmanager:9093', editable: false, jsonData: {implementation: prometheus, handleGrafanaManagedAlerts: false}}
