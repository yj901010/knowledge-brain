apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain-registry
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app: brain-registry}
  template:
    metadata:
      labels: {app: brain-registry}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 0
        fsGroup: 1001
      containers:
        - name: registry
          image: {{ .Values.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          env:
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /config/application.properties
            - name: JAVA_MAX_MEM_RATIO
              value: "65"
            - name: KAFKA_CA_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.kafka.clusterName }}-cluster-ca-cert, key: ca.password}
            - name: KAFKA_USER_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.kafka.userName }}, key: user.password}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          startupProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: management}
            periodSeconds: 10
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: kafka-ca, mountPath: /kafka/ca, readOnly: true}
            - {name: kafka-user, mountPath: /kafka/user, readOnly: true}
            - {name: tmp, mountPath: /tmp}
{{- if .Values.oidc.trustSecret }}
            - {name: oidc-trust, mountPath: /oidc, readOnly: true}
{{- end }}
      volumes:
        - name: config
          configMap: {name: brain-registry-config}
        - name: kafka-ca
          secret:
            secretName: {{ .Values.kafka.clusterName }}-cluster-ca-cert
            items: [{key: ca.p12, path: ca.p12}]
        - name: kafka-user
          secret:
            secretName: {{ .Values.kafka.userName }}
            items: [{key: user.p12, path: user.p12}]
{{- if .Values.oidc.trustSecret }}
        - name: oidc-trust
          secret:
            secretName: {{ .Values.oidc.trustSecret }}
            items: [{key: ca.crt, path: ca.crt}]
{{- end }}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: brain-registry
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector: {app: brain-registry}
  ports:
    - {name: http, port: 8080, targetPort: http}
