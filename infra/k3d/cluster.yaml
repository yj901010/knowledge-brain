apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: knowledge-brain
servers: 1
agents: 1
image: rancher/k3s:v1.35.5-k3s1
kubeAPI:
  host: 127.0.0.1
  hostIP: 127.0.0.1
  hostPort: "6550"
ports:
  - port: 127.0.0.1:8088:80
    nodeFilters:
      - loadbalancer
options:
  k3d:
    wait: true
    timeout: 180s
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false

