apiVersion: v1
kind: Namespace
metadata:
  name: brain-ops
  labels:
    app.kubernetes.io/part-of: knowledge-brain
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: brain-headlamp-viewer
  namespace: brain-ops
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: brain-headlamp-observer
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - namespaces
  - persistentvolumes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  - volumeattachments
  - csidrivers
  - csinodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - metrics.k8s.io
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kafka.strimzi.io
  resources:
  - kafkas
  - kafkanodepools
  - kafkatopics
  - kafkausers
  - kafkaconnects
  - kafkaconnectors
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: brain-headlamp-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: brain-headlamp-viewer
  namespace: brain-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: brain-headlamp-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: brain-headlamp-observer
subjects:
- kind: ServiceAccount
  name: brain-headlamp-viewer
  namespace: brain-ops
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: brain-headlamp-ui
  namespace: brain-ops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: headlamp
      app.kubernetes.io/instance: brain-headlamp
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          headlamp-validation: 'true'
    ports:
    - protocol: TCP
      port: 4466
