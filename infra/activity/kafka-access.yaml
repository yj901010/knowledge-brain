        type: topic
        name: learning.concept-evidence.v1
        patternType: literal
      operations:
      - Read
      - Describe
    - resource:
        type: topic
        name: learning.media-evidence.v1
        patternType: literal
      operations:
      - Read
      - Describe
    - resource:
        type: topic
        name: learning.evidence-session.v1
