        patternType: literal
      operations:
      - Read
      - Describe
    - resource:
        type: topic
        name: content.decision.v1
        patternType: literal
      operations:
      - Read
      - Describe
    - resource:
        type: topic
        name: content.record-concepts.v1
        patternType: literal
