replicaCount: 2
image:
  repository: knowledge-brain/learning-service
  tag: ''
  pullPolicy: IfNotPresent
resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: '1'
    memory: 768Mi
env:
- name: BRAIN_LEARNING_PERSISTENCE_ENABLED
  value: 'true'
- name: BRAIN_LEARNING_API_ENABLED
  value: 'true'
- name: BRAIN_LEARNING_DATABASE_URL
  value: jdbc:postgresql://brain-postgres.brain-data.svc:5432/brain_learning
- name: BRAIN_LEARNING_DATABASE_PASSWORD
  valueFrom:
    secretKeyRef:
      name: brain-learning-db
      key: password
- name: BRAIN_LEARNING_DATABASE_MAXIMUM_POOL_SIZE
  value: '10'
- name: BRAIN_LEARNING_SPACE_ORIGIN
  value: https://space-service.brain-apps.svc:8080
- name: BRAIN_LEARNING_SPACE_TRUST_FILE
  value: /space-trust/ca.crt
- name: BRAIN_LEARNING_SPACE_AUTHORIZATION_KEY
  valueFrom:
    secretKeyRef:
      name: brain-learning-space-authorization
      key: key
- name: SERVER_SSL_ENABLED
  value: 'true'
- name: SERVER_SSL_CERTIFICATE
  value: file:/api-tls/tls.crt
- name: SERVER_SSL_CERTIFICATE_PRIVATE_KEY
  value: file:/api-tls/tls.key
- name: SERVER_FORWARD_HEADERS_STRATEGY
  value: NONE
- name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE
  value: readinessState,learningDatabase
- name: BRAIN_LEARNING_BROWSER_ORIGIN
  value: https://localhost:8443
- name: BRAIN_LEARNING_PUBLIC_ENABLED
  value: 'false'
- name: BRAIN_LEARNING_COLLABORATION_REFERENCE_ENABLED
  value: 'true'
- name: BRAIN_LEARNING_COLLABORATION_REFERENCE_KEY
  valueFrom:
    secretKeyRef:
      name: brain-collaboration-learning-reference
      key: key
- name: BRAIN_LEARNING_COLLABORATION_ORIGIN
  value: https://collaboration-service.brain-apps.svc:8080
probeScheme: HTTPS
restrictGuestApiIngress: true
extraVolumeMounts:
- name: api-tls
  mountPath: /api-tls
  readOnly: true
- name: space-trust
  mountPath: /space-trust
  readOnly: true
extraVolumes:
- name: api-tls
  secret:
    secretName: brain-learning-api-tls
- name: space-trust
  secret:
    secretName: brain-guest-api-trust
