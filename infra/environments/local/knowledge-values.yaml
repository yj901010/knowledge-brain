replicaCount: 1
image:
  repository: knowledge-brain/knowledge-service
  tag: ''
  pullPolicy: Never
  digest: sha256:47c15e47977bf67735093fae0c48b729343cb136d41b6ef69bef9f13af6b1cf1
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: '1'
    memory: 768Mi
env:
- name: BRAIN_KNOWLEDGE_PUBLIC_ENABLED
  value: 'true'
- name: BRAIN_KNOWLEDGE_PERSISTENCE_ENABLED
  value: 'true'
- name: BRAIN_KNOWLEDGE_API_ENABLED
  value: 'true'
- name: BRAIN_KNOWLEDGE_DATABASE_URL
  value: jdbc:postgresql://brain-postgres.brain-data.svc:5432/brain_knowledge
- name: BRAIN_KNOWLEDGE_DATABASE_PASSWORD
  valueFrom:
    secretKeyRef:
      name: brain-knowledge-db
      key: password
- name: BRAIN_KNOWLEDGE_DATABASE_MAXIMUM_POOL_SIZE
  value: '3'
- name: BRAIN_KNOWLEDGE_SPACE_ORIGIN
  value: https://space-service.brain-apps.svc:8080
- name: BRAIN_KNOWLEDGE_SPACE_TRUST_FILE
  value: /space-trust/ca.crt
- name: BRAIN_KNOWLEDGE_SPACE_AUTHORIZATION_KEY
  valueFrom:
    secretKeyRef:
      name: brain-knowledge-space-authorization
      key: key
- name: SERVER_SSL_ENABLED
  value: 'true'
- name: SERVER_SSL_CERTIFICATE
  value: file:/api-tls/tls.crt
- name: SERVER_SSL_CERTIFICATE_PRIVATE_KEY
  value: file:/api-tls/tls.key
- name: SERVER_FORWARD_HEADERS_STRATEGY
  value: NONE
- name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE
  value: readinessState,knowledgeDatabase
- name: BRAIN_KNOWLEDGE_BROWSER_ORIGIN
  value: https://localhost:8443
- name: BRAIN_KNOWLEDGE_CONTENT_KEY
  valueFrom:
    secretKeyRef:
      name: brain-content-knowledge-authorization
      key: key
- name: BRAIN_KNOWLEDGE_SNAPSHOT_ENABLED
  value: 'true'
- name: BRAIN_KNOWLEDGE_SNAPSHOT_KEY
  valueFrom:
    secretKeyRef:
      name: brain-knowledge-network-snapshot
      key: key
- name: BRAIN_KNOWLEDGE_ACTIVITY_EXPORT_ENABLED
  value: 'true'
- name: BRAIN_KNOWLEDGE_ACTIVITY_EXPORT_KEY
  valueFrom:
    secretKeyRef:
      name: brain-knowledge-activity-export
      key: key
- name: BRAIN_KNOWLEDGE_PUBLIC_DISCOVERY_ENABLED
  value: 'true'
- name: BRAIN_KNOWLEDGE_PUBLIC_DISCOVERY_SNAPSHOT_KEY
  valueFrom:
    secretKeyRef:
      name: brain-knowledge-public-snapshot
      key: key
- name: BRAIN_KNOWLEDGE_PUBLIC_DISCOVERY_CHECK_KEY
  valueFrom:
    secretKeyRef:
      name: brain-knowledge-public-check
      key: key
deploymentStrategy:
  type: Recreate
